name: Validate branch licensing

on:
  push:
    branches: [feat/branch-license-thorcontrol]
    paths:
      - '.github/scripts/patch-branch-license.py'
      - '.github/workflows/oneoff-branch-license.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/branch-license-thorcontrol
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply UI integration patch
        run: python .github/scripts/patch-branch-license.py
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/control/control-client.tsx src/app/control/customer-provision-modal.tsx src/app/dashboard/'[...slug]'/license-actions.ts src/app/dashboard/'[...slug]'/advanced-shell.tsx src/app/dashboard/'[...slug]'/page.tsx
          if git diff --cached --quiet; then
            echo "No implementation changes"
          else
            git commit -m "feat: license extra stores and branches"
            git push origin HEAD:feat/branch-license-thorcontrol
          fi
