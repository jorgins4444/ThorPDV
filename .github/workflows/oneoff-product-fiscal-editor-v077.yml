name: One-off Product Fiscal Editor v077

on:
  push:
    paths:
      - '.github/scripts/patch-product-fiscal-editor-v077.py'
      - '.github/workflows/oneoff-product-fiscal-editor-v077.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrate guided fiscal editor
        run: python3 .github/scripts/patch-product-fiscal-editor-v077.py
      - name: Validate TypeScript build
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Commit patch
        run: |
          git config user.name "ThorPDV Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/dashboard/'[...slug]'/product-master-workspace.tsx src/app/dashboard/'[...slug]'/product-master.css
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: align product tax editor with guided fiscal tabs"
          git push
