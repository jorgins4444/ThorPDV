name: One-off v077 alignment
on:
  push:
    branches: [feat/matriz-fiscal-fast-v077]
    paths: ['.github/workflows/one-off-v077-align.yml']
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/matriz-fiscal-fast-v077
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align UI and optimize NFC-e flow
        shell: python
        run: |
          from pathlib import Path
          import re

          # Configurações: dados cadastrais/fiscais do emitente deixam de ser duplicados aqui.
          p=Path('src/app/dashboard/[...slug]/branch-config-workspace.tsx')
          s=p.read_text()
          old="""const tabs=[
            ['general','Geral'],['terminals','Meus Terminais'],['fiscal','Fiscal'],['parameters','Parâmetros'],
            ['tax','Grupo de tributos'],['delivery','Taxa de entrega'],['integrations','Integrações'],['history','Histórico'],
          ] as const;"""
          new="""const tabs=[
            ['terminals','Meus Terminais'],['parameters','Parâmetros'],['tax','Grupo de tributos'],
            ['delivery','Taxa de entrega'],['integrations','Integrações'],['history','Histórico'],
          ] as const;"""
          if old not in s: raise SystemExit('tabs block not found')
          s=s.replace(old,new,1)
          s=s.replace("useState<(typeof tabs)[number][0]>('general')","useState<(typeof tabs)[number][0]>('terminals')",1)
          old_top='''<div className="branch-config-top"><div><span>CONFIGURAÇÃO DA FILIAL</span><h2>{text(branch.name)||'Filial'}</h2><p>Dados do estabelecimento, terminais, parâmetros do PDV e integrações. Certificado, CSC, ambiente, séries e transmissão ficam centralizados no módulo Fiscal.</p></div><label>Filial<select value={branchId} onChange={e=>setBranchId(e.target.value)}>{branches.map(b=><option key={text(b.id)} value={text(b.id)}>{text(b.name)}</option>)}</select></label></div>'''
          new_top='''<div className="branch-config-top"><div><span>CONFIGURAÇÃO OPERACIONAL</span><h2>{branches.length===1?'Matriz':text(branch.name)||'Unidade'}</h2><p>Terminais, parâmetros do PDV e integrações. CNPJ, IE, CRT, endereço e demais dados do emitente são alterados exclusivamente em Administrativo → Matriz; certificado, ambiente, séries, CSC e DANFE ficam em Fiscal.</p></div>{branches.length>1?<label>Unidade<select value={branchId} onChange={e=>setBranchId(e.target.value)}>{branches.map(b=><option key={text(b.id)} value={text(b.id)}>{b.is_headquarters?'Matriz':text(b.name)}</option>)}</select></label>:<span className="branch-master-badge">Matriz</span>}</div>'''
          if old_top not in s: raise SystemExit('branch config top block not found')
          s=s.replace(old_top,new_top,1)
          p.write_text(s)

          # Fiscal: mostrar claramente a origem cadastral do emitente.
          p=Path('src/app/dashboard/[...slug]/fiscal-configuration-workspace.tsx')
          s=p.read_text()
          if "import Link from 'next/link';" not in s:
            s=s.replace("'use client';\n\n", "'use client';\n\nimport Link from 'next/link';\n",1)
          marker="  const [settings,setSettings]=useState<Row>(initialSettings);\n"
          if marker not in s: raise SystemExit('fiscal settings state marker not found')
          s=s.replace(marker,marker+"  const issuer=(settings.issuer&&typeof settings.issuer==='object'?settings.issuer:{}) as Row;\n",1)
          ret="  return <div className=\"fiscal-config-stack\">\n"
          card='''  return <div className="fiscal-config-stack">\n    <section className="erp-module-card fiscal-config-card fiscal-matrix-source">\n      <div className="fiscal-section-head"><div><h2>Emitente fiscal · Matriz</h2><p>CNPJ, Inscrição Estadual, CRT e endereço são carregados do cadastro mestre da Matriz e usados pelo ThorFiscal na NFC-e.</p></div><Link className="erp-ghost" href="/dashboard/administrativo/empresas">Editar Matriz</Link></div>\n      <div className="fiscal-matrix-grid"><span><small>CNPJ</small><b>{txt(issuer.cnpj)||'Não informado'}</b></span><span><small>Inscrição Estadual</small><b>{txt(issuer.state_registration)||'Não informada'}</b></span><span><small>CRT</small><b>{txt(issuer.tax_regime)||'Não definido'}</b></span><span><small>Município / UF</small><b>{[txt(issuer.city),txt(issuer.state)].filter(Boolean).join(' / ')||'Não informado'}</b></span></div>\n    </section>\n'''
          if ret not in s: raise SystemExit('fiscal return marker not found')
          s=s.replace(ret,card,1)
          p.write_text(s)

          p=Path('src/app/dashboard/[...slug]/fiscal-configuration.css')
          s=p.read_text()
          if '/* matriz fiscal source v077 */' not in s:
            s+='''\n/* matriz fiscal source v077 */\n.fiscal-matrix-source{background:linear-gradient(135deg,#fff,#f8fffb)}.fiscal-matrix-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.fiscal-matrix-grid span{display:grid;gap:4px;border:1px solid #e4e9e6;background:#fff;border-radius:9px;padding:11px}.fiscal-matrix-grid small{font-size:10px;color:#778178}.fiscal-matrix-grid b{font-size:12px;word-break:break-word}.branch-master-badge{align-self:center;border-radius:999px;background:#e8f8ef;color:#087b4b;font-size:11px;font-weight:900;padding:8px 11px}@media(max-width:800px){.fiscal-matrix-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.fiscal-matrix-grid{grid-template-columns:1fr}}\n'''
          p.write_text(s)

          # Desktop: elimina sincronização fiscal duplicada e polling de 1,5s.
          p=Path('desktop-pdv/renderer/app.js')
          s=p.read_text()
          progress_pattern=re.compile(r"function fiscalProgressSteps\(fiscal,phase\)\{[\s\S]*?\n\}\nfunction paintFiscalProgress\(m,sale,phase='waiting'\)\{[\s\S]*?\n\}\n\nasync function boot",re.M)
          progress_replacement=r'''function fiscalProgressSteps(fiscal,phase){
            const status=String(fiscal?.status||'requested');
            const phaseIndex={queueing:0,building:1,sending:2,waiting:3,done:3,printing:4,printed:5}[phase]??0;
            const authorized=status==='authorized',rejected=status==='rejected',failed=status==='transmission_error';
            const steps=[['Preparando NFC-e',0],['Assinando XML',1],['Enviando à SEFAZ',2],['Autorização',3],['Impressão',4]];
            return `<div class="fiscal-progress-steps smooth">${steps.map(([label,index])=>{const done=phase==='printed'||index<phaseIndex||(index===3&&authorized)||(index===2&&(authorized||rejected||failed));const active=!done&&index===Math.min(phaseIndex,4)&&!(rejected||failed);const error=(rejected||failed)&&index===3;return `<div class="fiscal-progress-step ${done?'done':''} ${active?'active':''} ${error?'error':''}"><i>${done?'✓':error?'!':''}</i><span>${label}</span></div>`}).join('')}</div>`;
          }
          function paintFiscalProgress(m,sale,phase='waiting'){
            if(!m?.isConnected)return;
            if(!m.dataset.fiscalStartedAt)m.dataset.fiscalStartedAt=String(Date.now());
            const elapsed=Math.max(0,Date.now()-Number(m.dataset.fiscalStartedAt||Date.now()));
            const fiscal=sale?.fiscal||{status:'requested'},status=String(fiscal.status||'requested');
            const isError=status==='rejected'||status==='transmission_error';
            const pctMap={queueing:9,building:28,sending:55,waiting:78,done:88,printing:95,printed:100};const pct=isError?82:(pctMap[phase]??15);
            let title='Preparando NFC-e',subtitle='Organizando os dados fiscais da venda.';
            if(phase==='building'){title='Gerando e assinando XML';subtitle='Aplicando certificado A1 e chave de acesso.';}
            if(phase==='sending'){title='Enviando para a SEFAZ';subtitle='Conexão segura com o autorizador fiscal.';}
            if(phase==='waiting'){title='Aguardando autorização';subtitle='A SEFAZ está validando a NFC-e.';}
            if(status==='authorized'){title=phase==='printing'?'NFC-e autorizada — imprimindo':phase==='printed'?'NFC-e autorizada e impressa':'NFC-e autorizada';subtitle=phase==='printing'?'Gerando o DANFE e enviando para a impressora.':phase==='printed'?'Documento fiscal concluído com sucesso.':'Autorização concluída.';}
            if(status==='rejected'){title='NFC-e rejeitada';subtitle=fiscalReason(fiscal)||'A SEFAZ rejeitou o documento.';}
            if(status==='transmission_error'){title='Falha no envio da NFC-e';subtitle=fiscalReason(fiscal)||'Não foi possível concluir a comunicação fiscal.';}
            const stopped=isError||phase==='printed';const details=isError?`<details class="fiscal-progress-details"><summary>Ver detalhes da transmissão</summary>${fiscalTimelineHtml(fiscal)}</details>`:'';
            const body=m.querySelector('#fiscalProgressBody');if(!body)return;
            body.innerHTML=`<div class="fiscal-progress-head smooth"><div class="fiscal-spinner ${stopped?'stopped':''} ${phase==='printed'?'success':''}">${phase==='printed'?'✓':''}</div><div><small>THORFISCAL / SEFAZ</small><h3>${esc(title)}</h3><p>${esc(subtitle)}</p></div><span class="fiscal-elapsed">${(elapsed/1000).toFixed(1)}s</span></div><div class="fiscal-flight"><div class="fiscal-flight-fill" style="width:${pct}%"></div><div class="fiscal-flight-glow" style="left:${Math.max(pct-2,0)}%"></div></div>${fiscalProgressSteps(fiscal,phase)}${isError?fiscalDiagnosticHtml(fiscal):''}<div class="fiscal-progress-meta"><span>Chave: <b>${esc(fiscal.access_key||'gerando...')}</b></span>${fiscal.protocol?`<span>Protocolo: <b>${esc(fiscal.protocol)}</b></span>`:''}${fiscalCode(fiscal)?`<span>cStat: <b>${esc(fiscalCode(fiscal))}</b></span>`:''}</div>${details}<div class="actions" id="fiscalProgressActions"></div>`;
            const actions=body.querySelector('#fiscalProgressActions');if(isError){actions.innerHTML='<button class="secondary" id="fiscalClose">Fechar</button><button class="primary" id="fiscalRetry">Tentar novamente</button>';actions.querySelector('#fiscalClose').onclick=()=>m.remove();actions.querySelector('#fiscalRetry').onclick=()=>{m.remove();requestNfceAndMaybePrint(saleKey(sale));};}else if(phase==='printed'){actions.innerHTML='<button class="primary" id="fiscalClose">Concluir</button>';actions.querySelector('#fiscalClose').onclick=()=>m.remove();}
          }

          async function boot'''
          s,count=progress_pattern.subn(progress_replacement,s,count=1)
          if count!=1: raise SystemExit('fiscal progress functions not found')

          req_pattern=re.compile(r"async function requestNfceAndMaybePrint\(key\)\{[\s\S]*?\n\}\n\nasync function safePrint",re.M)
          req_replacement=r'''async function requestNfceAndMaybePrint(key){
            const m=modal('<div id="fiscalProgressBody"></div>','wide');m.dataset.fiscalStartedAt=String(Date.now());paintFiscalProgress(m,{fiscal:{status:'requested',events:[]}},'queueing');
            try{
              const requested=await window.thor.requestNfce({saleKey:key});
              if(requested.alreadyAuthorized){const done=await window.thor.fiscalSale(key);paintFiscalProgress(m,done,'printing');const printed=await safePrint(key,'nfce');paintFiscalProgress(m,done,printed?'printed':'done');if(printed)setTimeout(()=>{if(m.isConnected)m.remove()},1100);return;}
              const started=Date.now(),deadline=started+45000;let sale=null,recoveryTriggered=false;
              while(Date.now()<deadline){
                const elapsed=Date.now()-started;const visualPhase=elapsed<420?'building':elapsed<1200?'sending':'waiting';
                try{sale=await window.thor.fiscalSale(key)}catch{}
                paintFiscalProgress(m,sale||{fiscal:{status:'processing',events:[]}},visualPhase);
                const status=String(sale?.fiscal?.status||'');if(fiscalTerminalStatuses.has(status))break;
                // requestNfce já dispara o sync em segundo plano. Um segundo sync aqui duplicava push/pull/heartbeat.
                if(!recoveryTriggered&&elapsed>6000){recoveryTriggered=true;window.thor.sync().catch(()=>{});}
                await wait(140);
              }
              if(!sale){try{sale=await window.thor.fiscalSale(key)}catch{}}
              const status=String(sale?.fiscal?.status||'');
              if(status==='authorized'){paintFiscalProgress(m,sale,'printing');void refreshFiscalSales();const printed=await safePrint(key,'nfce');paintFiscalProgress(m,sale,printed?'printed':'done');if(printed)setTimeout(()=>{if(m.isConnected)m.remove()},1100);return;}
              if(status==='rejected'||status==='transmission_error'){void refreshFiscalSales();paintFiscalProgress(m,sale,'waiting');return;}
              const actions=m.querySelector('#fiscalProgressActions');if(actions){actions.innerHTML='<button class="secondary" id="fiscalClose">Fechar</button><button class="primary" id="fiscalRefreshNow">Atualizar agora</button>';actions.querySelector('#fiscalClose').onclick=()=>m.remove();actions.querySelector('#fiscalRefreshNow').onclick=async()=>{window.thor.sync().catch(()=>{});await wait(250);const current=await window.thor.fiscalSale(key);paintFiscalProgress(m,current,'waiting');};}
              const body=m.querySelector('#fiscalProgressBody');if(body&&!body.querySelector('.fiscal-timeout-note'))body.insertAdjacentHTML('beforeend','<div class="fiscal-diagnostic warning fiscal-timeout-note"><b>A autorização continua sendo acompanhada</b><span>Use “Atualizar agora” para consultar o retorno sem gerar outra numeração.</span></div>');
            }catch(e){const body=m.querySelector('#fiscalProgressBody');if(body)body.innerHTML=`<h3>Falha ao iniciar NFC-e</h3><div class="fiscal-diagnostic error"><b>Não foi possível iniciar a transmissão</b><span>${esc(friendlyError(e.message))}</span></div><div class="actions"><button class="primary" id="fiscalClose">Fechar</button></div>`;m.querySelector('#fiscalClose')?.addEventListener('click',()=>m.remove());}
          }

          async function safePrint'''
          s,count=req_pattern.subn(req_replacement,s,count=1)
          if count!=1: raise SystemExit('requestNfceAndMaybePrint not found')
          safe_pattern=re.compile(r"async function safePrint\(key,type\)\{[\s\S]*?\n\}\n\nfunction renderFiscalWorkspace",re.M)
          safe_replacement=r'''async function safePrint(key,type){
            try{const r=await window.thor.printSale(key,type);if(r?.cancelled)return false;showToast(type==='nfce'?'NFC-e enviada para impressão.':'Comprovante enviado para impressão.');return true;}
            catch(e){if(e.message==='printer_not_configured')infoModal('Impressora não configurada','Abra Configurações (F12), escolha uma impressora instalada no Windows ou “Salvar como PDF”.');else infoModal('Impressão',friendlyError(e.message));return false;}
          }

          function renderFiscalWorkspace'''
          s,count=safe_pattern.subn(safe_replacement,s,count=1)
          if count!=1: raise SystemExit('safePrint not found')
          p.write_text(s)

          p=Path('desktop-pdv/renderer/styles.css');s=p.read_text()
          if '/* nfce fast smooth v077 */' not in s:
            s+='''\n/* nfce fast smooth v077 */\n.fiscal-progress-head.smooth{position:relative;padding-right:72px}.fiscal-elapsed{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:12px;font-weight:900;color:#607068;background:#f2f6f4;border:1px solid #e0e8e3;border-radius:999px;padding:7px 9px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}.fiscal-flight{height:7px;position:relative;overflow:hidden;border-radius:999px;background:#edf2ef;margin:18px 0 4px}.fiscal-flight-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#19834b,#37a96b);transition:width .35s cubic-bezier(.2,.8,.2,1)}.fiscal-flight-glow{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);background:#49b67a33;box-shadow:0 0 20px #39a86d66;transition:left .35s cubic-bezier(.2,.8,.2,1);animation:fiscalGlow 1.2s ease-in-out infinite}.fiscal-progress-steps.smooth{margin-top:12px}.fiscal-progress-steps.smooth .fiscal-progress-step{position:relative;overflow:hidden;transition:border-color .25s,background .25s,color .25s,transform .25s}.fiscal-progress-steps.smooth .fiscal-progress-step.active{transform:translateY(-2px);box-shadow:0 8px 20px #b8832630}.fiscal-progress-steps.smooth .fiscal-progress-step.active:after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,#fff8 50%,transparent 80%);transform:translateX(-120%);animation:fiscalSweep 1.35s linear infinite}.fiscal-progress-step.error{border-color:#efb7bc;background:#fff1f2;color:#9e2933}.fiscal-progress-step.error i{border-color:#d44955;color:#b52d39}.fiscal-spinner.success{display:grid;place-items:center;border:0;background:#19834b;color:#fff;font-size:22px;font-weight:900;animation:fiscalPop .38s ease-out}.fiscal-progress-details{margin-top:12px;border:1px solid #e3e9e5;border-radius:10px;background:#fafcfb;padding:8px 10px}.fiscal-progress-details summary{cursor:pointer;font-size:11px;font-weight:850;color:#66736c}.fiscal-timeout-note{margin-top:14px}@keyframes fiscalGlow{50%{transform:translate(-50%,-50%) scale(1.35);opacity:.45}}@keyframes fiscalSweep{to{transform:translateX(120%)}}@keyframes fiscalPop{0%{transform:scale(.72);opacity:.2}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}\n'''
          p.write_text(s)

          p=Path('desktop-pdv/package.json');s=p.read_text()
          if '"version": "0.7.6"' not in s: raise SystemExit('desktop version is not 0.7.6')
          p.write_text(s.replace('"version": "0.7.6"','"version": "0.7.7"',1))

      - name: Validate Desktop
        run: |
          node --check desktop-pdv/renderer/app.js
          node --check desktop-pdv/main.js
          node --check desktop-pdv/agent/index.js
          node -e "const p=require('./desktop-pdv/package.json');if(p.version!=='0.7.7')process.exit(1)"
      - name: Validate Thor Gestão
        run: |
          npm install
          npm run typecheck
          npm run build
          npm run lint
      - name: Commit aligned application
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-pdv src/app/dashboard/'[...slug]'
          git commit -m "feat: align Matriz navigation and speed NFC-e UX"
          git push origin HEAD:feat/matriz-fiscal-fast-v077
