name: One-off SVRS TLS Chain

on:
  push:
    paths:
      - '.github/workflows/oneoff-sefaz-tls-chain.yml'

permissions:
  contents: read

jobs:
  fetch-root:
    runs-on: windows-latest
    steps:
      - name: Download official ICP-Brasil v10 root over trusted Windows TLS
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tls-root | Out-Null
          Invoke-WebRequest -Uri 'https://repositorio.serpro.gov.br/docs/icpbrasilv10.crt' -OutFile 'tls-root/icp-brasil-v10.crt'
          certutil -dump tls-root/icp-brasil-v10.crt | Out-File -Encoding utf8 tls-root/root-dump.txt
          certutil -hashfile tls-root/icp-brasil-v10.crt SHA256 | Out-File -Encoding utf8 tls-root/root-file-sha256.txt
          Get-Content tls-root/root-dump.txt
      - uses: actions/upload-artifact@v4
        with:
          name: icp-brasil-v10-root
          path: tls-root
          if-no-files-found: error

  inspect-linux:
    runs-on: ubuntu-latest
    needs: fetch-root
    steps:
      - name: Capture SVRS TLS chain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tls-chain
          echo | openssl s_client -showcerts -connect nfce.svrs.rs.gov.br:443 -servername nfce.svrs.rs.gov.br 2>&1 | tee tls-chain/openssl.txt
          awk '/-----BEGIN CERTIFICATE-----/{n++; out=sprintf("tls-chain/cert-%02d.pem",n)} out{print > out} /-----END CERTIFICATE-----/{close(out); out=""}' tls-chain/openssl.txt
          : > tls-chain/summary.txt
          for f in tls-chain/cert-*.pem; do
            echo "### $f" | tee -a tls-chain/summary.txt
            openssl x509 -in "$f" -noout -subject -issuer -serial -dates -fingerprint -sha256 | tee -a tls-chain/summary.txt
          done
      - uses: actions/download-artifact@v4
        with:
          name: icp-brasil-v10-root
          path: tls-root
      - name: Verify live SVRS chain with official v10 root
        shell: bash
        run: |
          set -euo pipefail
          if openssl x509 -in tls-root/icp-brasil-v10.crt -noout >/dev/null 2>&1; then
            cp tls-root/icp-brasil-v10.crt tls-chain/icp-brasil-v10.pem
          else
            openssl x509 -inform DER -in tls-root/icp-brasil-v10.crt -out tls-chain/icp-brasil-v10.pem
          fi
          openssl x509 -in tls-chain/icp-brasil-v10.pem -noout -subject -issuer -serial -dates -fingerprint -sha256 | tee tls-chain/root-v10-summary.txt
          openssl verify -CAfile tls-chain/icp-brasil-v10.pem -untrusted tls-chain/cert-02.pem tls-chain/cert-01.pem | tee tls-chain/verify-with-v10.txt
      - uses: actions/upload-artifact@v4
        with:
          name: svrs-tls-chain-verified
          path: tls-chain
          if-no-files-found: error
