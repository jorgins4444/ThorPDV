name: Validate PDV settings v081

on:
  push:
    branches: [fix/pdv-settings-fast-v081]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Renderer syntax
        run: node --check desktop-pdv/renderer/app.js
      - name: Main syntax
        run: node --check desktop-pdv/main.js
      - name: Package version
        run: node -e "const p=require('./desktop-pdv/package.json'); if(p.version!=='0.8.1') process.exit(1);"
