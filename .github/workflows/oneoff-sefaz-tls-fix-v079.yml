name: One-off SEFAZ TLS Fix v079

on:
  push:
    paths:
      - '.github/workflows/oneoff-sefaz-tls-fix-v079.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply TLS trust and ERP retry patch
        run: python3 scripts/patch_sefaz_tls_trust_v079.py
      - name: Validate embedded ICP-Brasil v10 trust anchor
        shell: bash
        run: |
          set -euo pipefail
          openssl x509 -in supabase/functions/thorfiscal-authorize/icp-brasil-v10.pem -noout -subject -issuer -dates -fingerprint -sha256
          test "$(openssl x509 -in supabase/functions/thorfiscal-authorize/icp-brasil-v10.pem -noout -fingerprint -sha256 | cut -d= -f2)" = "6E:0B:FF:06:9A:26:99:4C:15:DE:2C:48:88:CC:54:AF:84:88:2E:54:95:B7:FB:F6:6B:E9:CC:FF:EC:74:89:F6"
          mkdir -p /tmp/svrs
          echo | openssl s_client -showcerts -connect nfce.svrs.rs.gov.br:443 -servername nfce.svrs.rs.gov.br 2>/dev/null | awk '/-----BEGIN CERTIFICATE-----/{n++; out=sprintf("/tmp/svrs/cert-%02d.pem",n)} out{print > out} /-----END CERTIFICATE-----/{close(out); out=""}'
          openssl verify -CAfile supabase/functions/thorfiscal-authorize/icp-brasil-v10.pem -untrusted /tmp/svrs/cert-02.pem /tmp/svrs/cert-01.pem
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check ThorFiscal edge function
        run: deno check --node-modules-dir=auto supabase/functions/thorfiscal-authorize/index.ts
      - name: Validate ERP application
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name "ThorPDV Automation"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/thorfiscal-authorize/index.ts src/app/dashboard/'[...slug]'/fiscal-workspace.tsx
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix: trust ICP-Brasil v10 for SEFAZ TLS transmission"
          git push
