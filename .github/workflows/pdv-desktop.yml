name: Build ThorPDV Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-pdv/**'
      - '.github/workflows/pdv-desktop.yml'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-pdv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter *.js -File | Where-Object {
            $_.FullName -notmatch '\\node_modules\\' -and $_.FullName -notmatch '\\dist\\'
          }
          if (-not $files) { throw 'No JavaScript files found to validate' }
          foreach ($file in $files) {
            $relative = Resolve-Path -Relative $file.FullName
            Write-Host "Checking $relative"
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\ThorPDV-Desktop-*-x64.exe | Select-Object -First 1
          if (-not $exe) { throw 'Installer not found' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path ($exe.FullName + '.sha256') -Value ($hash + '  ' + $exe.Name) -Encoding ascii
          Write-Host ('SHA256 ' + $hash)

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ThorPDV-Desktop-Windows
          path: |
            desktop-pdv/dist/*.exe
            desktop-pdv/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $tag = 'pdv-v' + $pkg.version
          $exe = Get-ChildItem dist\ThorPDV-Desktop-*-x64.exe | Select-Object -First 1
          if (-not $exe) { throw 'Installer not found for release' }
          $sha = $exe.FullName + '.sha256'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title ('ThorPDV Desktop ' + $pkg.version) --notes ('ThorPDV Desktop ' + $pkg.version + '. Build Windows estável baseado na série 0.8.79 com correções de sincronização.')
          }
          gh release upload $tag $exe.FullName $sha --clobber
