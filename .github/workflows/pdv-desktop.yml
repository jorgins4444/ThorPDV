name: Build ThorPDV Desktop

on:
  workflow_dispatch:
  push:
    branches: [main, pdv-rebuild-from-0.8.44, pdv-rework-from-0.8.55]
    paths:
      - 'desktop-pdv/**'
      - '.github/workflows/pdv-desktop.yml'

permissions:
  contents: write

concurrency:
  group: thorpdv-desktop-${{ github.ref }}
  cancel-in-progress: true

# ThorPDV Desktop build + durable release assets for ThorControl rollouts.
# Rebuild releases use a separate tag namespace so archived artifacts remain
# available for diagnostics without being reused accidentally.
jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-pdv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-pdv/package.json

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          $files = @(
            'main-v090.js',
            'main.js',
            'preload.js',
            'ipc-store-credit-v105.js',
            'ipc-receivable-v115.js',
            'updater.js',
            'agent/cash-movement-receipt-v123.js',
            'agent/sqlite-optimization-v124.js',
            'agent/store.js',
            'agent/print-service.js',
            'agent/background-queue.js',
            'agent/sync-request-worker.js',
            'agent/hardware.js',
            'agent/sync.js',
            'agent/index.js',
            'agent/v3.js',
            'agent/v3-return.js',
            'agent/v3-enroll.js',
            'agent/v3-profile-permissions.js',
            'agent/v4-permissions.js',
            'agent/product-rules-v046.js',
            'agent/customer-credit-v050.js',
            'agent/store-credit-return-v105.js',
            'agent/return-quantity-guard-v106.js',
            'agent/scale-label-v060.js',
            'agent/sync-policy.js',
            'agent/recovery.js',
            'agent/operations-center-v120.js',
            'agent/consistency.js',
            'agent/cash-closing.js',
            'agent/cash-close-receipt-v112.js',
            'agent/cash-close-receivable-v115.js',
            'agent/cash-close-print-layout-v113.js',
            'agent/receivable-v115.js',
            'agent/receivable-idempotency-v115.js',
            'agent/receivable-print-v115.js',
            'agent/production.js',
            'agent/pre-sale-v064.js',
            'agent/commercial-v070.js',
            'agent/sales-options-v071.js',
            'agent/sales-settlement-v073.js',
            'agent/product-images-v090.js',
            'agent/receipt-print-v829.js',
            'agent/sale-identity-v830.js',
            'renderer/app.js',
            'scripts/build-renderer-bundle.js',
            'renderer/update-center.js',
            'renderer/seller-v125.js',
            'renderer/checkout-v3.js',
            'renderer/hotfix-v042.js',
            'renderer/validation-v3.js',
            'renderer/sync-recovery.js',
            'renderer/operator-gate.js',
            'renderer/cash-closing.js',
            'renderer/ux-v038.js',
            'renderer/ux-v039.js',
            'renderer/scanner-v039.js',
            'renderer/cash-cycle-v040.js',
            'renderer/permissions-v041.js',
            'renderer/cart-ui-v043.js',
            'renderer/messages-v044.js',
            'renderer/discount-v045.js',
            'renderer/weighable-v046.js',
            'renderer/product-policy-v046.js',
            'renderer/sale-layout-v047.js',
            'renderer/state-hotfix-v048.js',
            'renderer/customer-identification-v049.js',
            'renderer/store-credit-v050.js',
            'renderer/return-credit-v105.js',
            'renderer/return-quantity-guard-v106.js',
            'renderer/store-credit-payment-v106.js',
            'renderer/store-credit-finalizer-v111.js',
            'renderer/scale-label-v060.js',
            'renderer/scale-label-v061.js',
            'renderer/quick-entry-v063.js',
            'renderer/commercial-v070.js',
            'renderer/sales-options-v071.js',
            'renderer/term-settlement-v072.js',
            'renderer/sales-settlement-v073.js',
            'renderer/first-sale-sync-v087.js',
            'renderer/redesign-v088.js',
            'renderer/redesign-v088-hotfix.js',
            'renderer/redesign-v089.js',
            'renderer/redesign-v089-fixes.js',
            'renderer/redesign-v090.js',
            'renderer/redesign-v092.js',
            'renderer/redesign-v093.js',
            'renderer/redesign-v098.js',
            'renderer/redesign-v099.js',
            'renderer/redesign-v100.js',
            'renderer/redesign-v101.js',
            'renderer/term-finalize-v102.js',
            'renderer/receipt-print-v829.js',
            'renderer/sale-identity-v830.js',
            'renderer/receivable-cash-summary-v115.js',
            'renderer/receivable-v115-pre.js',
            'renderer/receivable-v115.js',
            'renderer/receivable-v115-post.js'
          )
          foreach ($file in $files) {
            Write-Host "Checking $file"
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install dependencies
        run: npm install

      - name: Validate consolidated renderer
        shell: pwsh
        run: |
          npm run bundle:renderer
          node --check renderer/thorpdv.bundle.js

      - name: Build Windows installer
        run: npm run dist:win

      - name: Generate SHA-256
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\ThorPDV-Desktop-*-x64.exe | Select-Object -First 1
          if (-not $exe) { throw 'Installer not found' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path ($exe.FullName + '.sha256') -Value ($hash + '  ' + $exe.Name) -Encoding ascii
          Write-Host ('SHA256 ' + $hash)

      - name: Upload temporary installer artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ThorPDV-Desktop-Windows
          path: |
            desktop-pdv/dist/*.exe
            desktop-pdv/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish durable GitHub Release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $isRebuild = $env:GITHUB_REF_NAME -eq 'pdv-rebuild-from-0.8.44'
          $tag = if ($isRebuild) { 'pdv-rebuild-v' + $pkg.version } else { 'pdv-v' + $pkg.version }
          $title = if ($isRebuild) { 'ThorPDV Desktop Rebuild ' + $pkg.version } else { 'ThorPDV Desktop ' + $pkg.version }
          $notes = if ($isRebuild) { 'ThorPDV Desktop ' + $pkg.version + ' reconstruído a partir da base estável 0.8.44. Distribuição somente por piloto no ThorControl.' } else { 'ThorPDV Desktop ' + $pkg.version + '. A distribuição aos clientes é controlada pelo ThorControl.' }
          $exe = Get-ChildItem dist\ThorPDV-Desktop-*-x64.exe | Select-Object -First 1
          $sha = $exe.FullName + '.sha256'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title $title --notes $notes
          }
          gh release upload $tag $exe.FullName $sha --clobber
