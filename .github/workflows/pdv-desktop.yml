name: Build ThorPDV Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-pdv/**'
      - '.github/workflows/pdv-desktop.yml'

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-pdv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prevent overwrite of an existing Windows release
        id: release_guard
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $tag = 'pdv-v' + $pkg.version
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = 'application/vnd.github+json'
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/releases/tags/$tag"
          $response = Invoke-WebRequest -Uri $uri -Headers $headers -SkipHttpErrorCheck -UseBasicParsing
          if ([int]$response.StatusCode -eq 200) {
            Write-Host "::notice::Release $tag already exists. Skipping build and avoiding installer overwrite."
            'skip=true' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } elseif ([int]$response.StatusCode -eq 404) {
            Write-Host "Release $tag does not exist. Starting build."
            'skip=false' | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            throw "Release verification failed with HTTP $($response.StatusCode); refusing to overwrite or publish."
          }

      - name: Validate JavaScript syntax
        if: steps.release_guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -Filter *.js -File | Where-Object {
            $_.FullName -notmatch '\\node_modules\\' -and $_.FullName -notmatch '\\dist\\'
          }
          if (-not $files) { throw 'No JavaScript files found to validate' }
          foreach ($file in $files) {
            $relative = Resolve-Path -Relative $file.FullName
            Write-Host "Checking $relative"
            node --check $file.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install dependencies
        if: steps.release_guard.outputs.skip != 'true'
        run: npm install

      - name: Build Windows installer
        if: steps.release_guard.outputs.skip != 'true'
        run: npm run dist:win

      - name: Generate SHA-256
        if: steps.release_guard.outputs.skip != 'true'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\ThorPDV-Desktop-*-x64.exe | Select-Object -First 1
          if (-not $exe) { throw 'Installer not found' }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content -Path ($exe.FullName + '.sha256') -Value ($hash + '  ' + $exe.Name) -Encoding ascii
          Write-Host ('SHA256 ' + $hash)

      - name: Upload installer artifact
        if: steps.release_guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ThorPDV-Desktop-Windows
          path: |
            desktop-pdv/dist/*.exe
            desktop-pdv/dist/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release assets
        if: steps.release_guard.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $pkg = Get-Content package.json | ConvertFrom-Json
          $tag = 'pdv-v' + $pkg.version
          $exe = Get-ChildItem dist\ThorPDV-Desktop-*-x64.exe | Select-Object -First 1
          if (-not $exe) { throw 'Installer not found for release' }
          $sha = $exe.FullName + '.sha256'
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title ('ThorPDV Desktop ' + $pkg.version) --notes ('ThorPDV Desktop ' + $pkg.version + '. Build Windows estável baseado na série 0.8.79 com correções de sincronização.')
          }
          gh release upload $tag $exe.FullName $sha
