name: Build ThorPDV Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'desktop-pdv/**'
      - '.github/workflows/pdv-desktop.yml'

jobs:
  windows-installer:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop-pdv
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop-pdv/package.json

      - name: Validate JavaScript syntax
        shell: pwsh
        run: |
          $files = @(
            'main.js',
            'preload.js',
            'agent/store.js',
            'agent/hardware.js',
            'agent/sync.js',
            'agent/index.js',
            'agent/v3.js',
            'agent/v3-return.js',
            'agent/v3-enroll.js',
            'agent/v3-profile-permissions.js',
            'agent/v4-permissions.js',
            'agent/product-rules-v046.js',
            'agent/customer-credit-v050.js',
            'agent/scale-label-v060.js',
            'agent/sync-policy.js',
            'agent/recovery.js',
            'agent/consistency.js',
            'agent/cash-closing.js',
            'agent/production.js',
            'agent/pre-sale-v064.js',
            'agent/commercial-v070.js',
            'agent/sales-options-v071.js',
            'renderer/app.js',
            'renderer/checkout-v3.js',
            'renderer/hotfix-v042.js',
            'renderer/validation-v3.js',
            'renderer/sync-recovery.js',
            'renderer/operator-gate.js',
            'renderer/cash-closing.js',
            'renderer/ux-v038.js',
            'renderer/ux-v039.js',
            'renderer/scanner-v039.js',
            'renderer/cash-cycle-v040.js',
            'renderer/permissions-v041.js',
            'renderer/cart-ui-v043.js',
            'renderer/messages-v044.js',
            'renderer/discount-v045.js',
            'renderer/weighable-v046.js',
            'renderer/product-policy-v046.js',
            'renderer/sale-layout-v047.js',
            'renderer/state-hotfix-v048.js',
            'renderer/customer-identification-v049.js',
            'renderer/store-credit-v050.js',
            'renderer/scale-label-v060.js',
            'renderer/scale-label-v061.js',
            'renderer/quick-entry-v063.js',
            'renderer/commercial-v070.js',
            'renderer/sales-options-v071.js'
          )
          foreach ($file in $files) {
            Write-Host "Checking $file"
            node --check $file
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install dependencies
        run: npm install

      - name: Build Windows installer
        run: npm run dist:win

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ThorPDV-Desktop-Windows
          path: desktop-pdv/dist/*.exe
          if-no-files-found: error
          retention-days: 14
