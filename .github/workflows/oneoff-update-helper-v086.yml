name: Validate ThorPDV updater helper v086

on:
  push:
    branches: [fix/update-helper-v086]
    paths:
      - '.github/scripts/patch-update-helper-v086.py'
      - '.github/workflows/oneoff-update-helper-v086.yml'

permissions:
  contents: write

jobs:
  windows-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/update-helper-v086
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and commit updater fix
        shell: pwsh
        run: |
          python .github/scripts/patch-update-helper-v086.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-pdv/updater.js desktop-pdv/renderer/update-center.js desktop-pdv/package.json
          if (-not (git diff --cached --quiet)) {
            git commit -m "fix: harden ThorPDV update helper handoff"
            git push origin HEAD:fix/update-helper-v086
          }
      - name: Validate JavaScript and version
        shell: pwsh
        run: |
          node --check desktop-pdv/updater.js
          node --check desktop-pdv/renderer/update-center.js
          node -e "const p=require('./desktop-pdv/package.json'); if(p.version!=='0.8.6') process.exit(1); console.log('Desktop',p.version)"
      - name: Export generated helpers
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const u=require('./desktop-pdv/updater.js'); fs.writeFileSync('ThorPDV-Update-Helper.ps1',u.__updateHelperScript(),'utf8'); fs.writeFileSync('ThorPDV-Update-Fallback.cmd',u.__fallbackCmdScript(),'utf8');"
      - name: Exercise PowerShell WPF helper startup
        shell: powershell
        run: |
          $status = Join-Path $env:RUNNER_TEMP 'thor-helper-status.json'
          $marker = Join-Path $env:RUNNER_TEMP 'thor-helper-marker.json'
          Remove-Item $status -ErrorAction SilentlyContinue
          & "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe" -NoProfile -ExecutionPolicy Bypass -File .\ThorPDV-Update-Helper.ps1 -Installer "$env:SystemRoot\System32\where.exe" -LaunchExe "$env:SystemRoot\System32\where.exe" -ParentPid 999999 -StatusPath $status -MarkerPath $marker -TargetVersion 0.8.6 -SelfTest
          if ($LASTEXITCODE -ne 0) { throw "PowerShell helper self-test exit $LASTEXITCODE" }
          $state = Get-Content -Raw -LiteralPath $status | ConvertFrom-Json
          if ($state.stage -ne 'helper_ready') { throw "Unexpected helper state: $($state.stage)" }
          Write-Host "PowerShell/WPF helper startup OK"
      - name: Exercise CMD fallback handoff
        shell: powershell
        run: |
          $source = @'
          using System;
          public static class FakeInstaller {
            public static int Main(string[] args) { return 0; }
          }
          '@
          Add-Type -TypeDefinition $source -OutputAssembly "$env:RUNNER_TEMP\fake-installer.exe" -OutputType ConsoleApplication
          $log = Join-Path $env:RUNNER_TEMP 'thor-helper-fallback.log'
          cmd.exe /d /q /c ".\ThorPDV-Update-Fallback.cmd `"$env:RUNNER_TEMP\fake-installer.exe`" `"$env:SystemRoot\System32\where.exe`" 999999 `"$log`" 0.8.6"
          if ($LASTEXITCODE -ne 0) { throw "CMD fallback exit $LASTEXITCODE" }
          $content = Get-Content -Raw -LiteralPath $log
          if ($content -notmatch 'Installer exit code 0') { throw 'Fallback did not complete installer successfully' }
          if ($content -notmatch 'Restarting ThorPDV') { throw 'Fallback did not reach restart stage' }
          Write-Host "CMD fallback handoff OK"
      - name: Install web dependencies
        shell: pwsh
        run: npm install
      - name: Typecheck web
        shell: pwsh
        run: npm run typecheck
      - name: Build web
        shell: pwsh
        run: npm run build
      - name: Lint web
        shell: pwsh
        run: npm run lint
