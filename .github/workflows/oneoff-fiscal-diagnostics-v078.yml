name: One-off Fiscal Diagnostics v078

on:
  push:
    paths:
      - '.github/workflows/oneoff-fiscal-diagnostics-v078.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fiscal diagnostics patch
        run: python3 scripts/patch_fiscal_diagnostics_v078.py
      - name: Validate web application
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Commit integration
        run: |
          git config user.name "ThorPDV Automation"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/thorfiscal-authorize/index.ts desktop-pdv/renderer/app.js desktop-pdv/renderer/styles.css desktop-pdv/agent/sync.js desktop-pdv/package.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: show live SEFAZ transmission diagnostics in PDV"
          git push
