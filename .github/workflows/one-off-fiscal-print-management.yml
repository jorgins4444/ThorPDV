name: One-off fiscal print management wiring

on:
  push:
    branches: [feat/fiscal-print-management-20260811]
    paths:
      - '.github/workflows/one-off-fiscal-print-management.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/fiscal-print-management-20260811
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wire fiscal management and Desktop printing
        shell: python
        run: |
          from pathlib import Path

          # Refresh enriched fiscal metadata immediately when the Fiscal screen opens.
          p=Path('src/app/dashboard/[...slug]/fiscal-workspace.tsx')
          s=p.read_text()
          old="""  useEffect(() => {\n    const timer = window.setInterval(() => setNow(Date.now()), 1000);\n    return () => window.clearInterval(timer);\n  }, []);"""
          new="""  useEffect(() => {\n    void refresh();\n    const timer = window.setInterval(() => setNow(Date.now()), 1000);\n    return () => window.clearInterval(timer);\n  }, []);"""
          if old not in s: raise SystemExit('FiscalWorkspace mount hook not found')
          p.write_text(s.replace(old,new,1))

          # Sales/Cash drawer now uses the same real ThorFiscal cancellation transport.
          p=Path('src/app/dashboard/[...slug]/sales-cash-workspace.tsx')
          s=p.read_text()
          marker="} from './actions';\n"
          if marker not in s: raise SystemExit('sales-cash import marker missing')
          s=s.replace(marker, marker+"import { erpFiscalCancel } from './fiscal-transmit-actions';\n",1)
          old="const r=await erpSalesCashCancelNfce(text(detail.sale.id),reason.trim());"
          new="const r=await erpFiscalCancel(text(detail.fiscal.id),reason.trim());"
          if old not in s: raise SystemExit('legacy Gestão cancellation call not found')
          s=s.replace(old,new,1)
          old_msg="else if(r.error==='fiscal_cancellation_transport_not_configured')setMessage('A NFC-e está dentro da janela de 30 minutos, mas a transmissão do evento de cancelamento ainda depende da integração fiscal homologada com o provedor/SEFAZ.');"
          new_msg="else if(r.error==='nfce_cancellation_rejected')setMessage(`SEFAZ rejeitou o cancelamento${r.cStat?` (${String(r.cStat)})`:''}: ${text(r.message||r.detail||'verifique o retorno fiscal')}`);else if(r.error==='nfce_cancellation_transmission_error')setMessage(`Falha de comunicação no cancelamento: ${text(r.message||r.detail||'tente novamente dentro do prazo')}`);"
          if old_msg not in s: raise SystemExit('legacy cancellation transport message not found')
          s=s.replace(old_msg,new_msg,1)
          p.write_text(s)

          # Electron resolves relative DANFE URLs through apiBase and sends the device token.
          p=Path('desktop-pdv/main.js')
          s=p.read_text()
          old="""  if (doc.kind === 'remote_pdf') {\n    if (!/^https?:\\/\\//i.test(doc.url || '')) { win.destroy(); throw new Error('nfce_pdf_url_unavailable'); }\n    await win.loadURL(doc.url);\n  } else {"""
          new="""  if (doc.kind === 'remote_pdf') {\n    const rawUrl = String(doc.url || '').trim();\n    let targetUrl = '';\n    try { targetUrl = new URL(rawUrl, `${String(agent.apiBase || '').replace(/\\/+$/, '')}/`).toString(); }\n    catch { win.destroy(); throw new Error('nfce_pdf_url_unavailable'); }\n    if (!/^https?:\\/\\//i.test(targetUrl)) { win.destroy(); throw new Error('nfce_pdf_url_unavailable'); }\n    const token = agent.deviceToken();\n    await win.loadURL(targetUrl, token ? { extraHeaders: `Authorization: Bearer ${token}\\n` } : undefined);\n  } else {"""
          if old not in s: raise SystemExit('desktop loadPrintable block not found')
          p.write_text(s.replace(old,new,1))

          # Authorized and cancelled NFC-e can be reprinted; cancelled DANFE is watermarked by backend.
          p=Path('desktop-pdv/agent/index.js')
          s=p.read_text()
          old="if(sale.fiscal?.status!=='authorized') throw new Error('nfce_not_authorized');"
          new="if(!['authorized','cancelled'].includes(String(sale.fiscal?.status||''))) throw new Error('nfce_not_authorized');"
          if old not in s: raise SystemExit('desktop NFC-e status check not found')
          p.write_text(s.replace(old,new,1))

          # New Desktop build contains the printing fix.
          p=Path('desktop-pdv/package.json')
          s=p.read_text()
          if '"version": "0.7.5"' not in s: raise SystemExit('desktop version 0.7.5 not found')
          p.write_text(s.replace('"version": "0.7.5"','"version": "0.7.6"',1))

      - name: Install and validate web app
        run: |
          npm install
          npm run typecheck
          npm run build
          npm run lint
      - name: Validate Desktop JavaScript
        run: |
          node --check desktop-pdv/main.js
          node --check desktop-pdv/agent/index.js
          node --check desktop-pdv/agent/v3.js
      - name: Commit wiring and remove one-off workflow
        run: |
          rm .github/workflows/one-off-fiscal-print-management.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src desktop-pdv package.json .github/workflows/one-off-fiscal-print-management.yml
          git commit -m "feat: print NFC-e and manage fiscal assets in Thor Gestão"
          git push origin HEAD:feat/fiscal-print-management-20260811
