name: One-off IBS CBS Library Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-ibscbs-lib-update]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade brasil-fiscal NFe package
        shell: python
        run: |
          from pathlib import Path
          path = Path('supabase/functions/thorfiscal-authorize/index.ts')
          text = path.read_text(encoding='utf-8')
          old = 'npm:@brasil-fiscal/nfe@2.0.6'
          new = 'npm:@brasil-fiscal/nfe@2.0.7'
          if old not in text:
            raise SystemExit('Expected 2.0.6 import not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check ThorFiscal with package 2.0.7
        run: deno check --node-modules-dir=auto supabase/functions/thorfiscal-authorize/index.ts

      - name: Smoke-test IBS/CBS XML generation
        shell: bash
        run: |
          cat > /tmp/ibscbs-smoke.ts <<'EOF'
          import { DefaultXmlBuilder } from "npm:@brasil-fiscal/nfe@2.0.7";

          const builder = new DefaultXmlBuilder();
          const xml = builder.build({
            identificacao: {
              naturezaOperacao: "VENDA AO CONSUMIDOR",
              tipoOperacao: 1,
              destinoOperacao: 1,
              finalidade: 1,
              consumidorFinal: 1,
              presencaComprador: 1,
              uf: "PI",
              municipio: "2202703",
              serie: 3,
              numero: 1,
              dataEmissao: new Date("2026-08-11T12:00:00-03:00"),
              tipoEmissao: 1,
              tipoImpressao: 4,
              ambiente: 2,
              modelo: "65",
            },
            emitente: {
              cnpj: "48629746000195",
              razaoSocial: "EMPRESA TESTE",
              inscricaoEstadual: "197267173",
              regimeTributario: 3,
              endereco: {
                logradouro: "RUA TESTE",
                numero: "1",
                bairro: "CENTRO",
                codigoMunicipio: "2202703",
                municipio: "COCAL",
                uf: "PI",
                cep: "64235000",
                codigoPais: "1058",
                pais: "Brasil",
              },
            },
            produtos: [{
              numero: 1,
              codigo: "1",
              descricao: "PRODUTO TESTE",
              ncm: "10061092",
              cfop: "5102",
              unidade: "UN",
              quantidade: 1,
              valorUnitario: 7.99,
              valorTotal: 7.99,
              icms: { origem: 0, cst: "40" },
              pis: { cst: "49", baseCalculo: 0, aliquota: 0, valor: 0 },
              cofins: { cst: "99", baseCalculo: 0, aliquota: 0, valor: 0 },
              ibsCbs: { cst: "000", cClassTrib: "000001", pIBSUF: 0.1, pIBSMun: 0, pCBS: 0.9 },
            }],
            transporte: { modalidadeFrete: 9 },
            pagamento: { pagamentos: [{ formaPagamento: "20", valor: 7.99 }] },
          } as any);

          console.log(xml);
          if (!xml.includes("<IBSCBS>")) throw new Error("IBSCBS item group missing");
          if (!xml.includes("<CST>000</CST><cClassTrib>000001</cClassTrib>")) throw new Error("IBSCBS CST/cClassTrib missing");
          if (!xml.includes("<IBSCBSTot>")) throw new Error("IBSCBSTot missing");
          if (!xml.includes("<vBCIBSCBS>7.99</vBCIBSCBS>")) throw new Error("vBCIBSCBS missing");
          EOF
          deno run --node-modules-dir=auto /tmp/ibscbs-smoke.ts

      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/one-off-ibscbs-lib-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/thorfiscal-authorize/index.ts .github/workflows/one-off-ibscbs-lib-update.yml
          git commit -m "fix: generate IBS CBS groups with nfe 2.0.7 [skip-ibscbs-lib-update]"
          git push origin HEAD:main
