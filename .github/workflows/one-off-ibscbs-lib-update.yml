name: One-off IBS CBS Library Update

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-ibscbs-lib-update]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Upgrade brasil-fiscal NFe package
        shell: python
        run: |
          from pathlib import Path
          path = Path('supabase/functions/thorfiscal-authorize/index.ts')
          text = path.read_text(encoding='utf-8')
          old = 'npm:@brasil-fiscal/nfe@2.0.6'
          new = 'npm:@brasil-fiscal/nfe@2.0.7'
          if old not in text:
            raise SystemExit('Expected 2.0.6 import not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check ThorFiscal with package 2.0.7
        run: deno check --node-modules-dir=auto supabase/functions/thorfiscal-authorize/index.ts

      - name: Validate installed builder has IBS/CBS item and totals
        shell: bash
        run: |
          MATCH=$(grep -R -l 'IBSCBSTot' node_modules/.deno 2>/dev/null | grep '@brasil-fiscal+nfe@2.0.7' | head -n 1 || true)
          if [ -z "$MATCH" ]; then
            echo 'IBSCBSTot not found in installed @brasil-fiscal/nfe@2.0.7 package'
            find node_modules/.deno -maxdepth 5 -type f -path '*brasil-fiscal*nfe*' | head -n 100
            exit 1
          fi
          echo "Validated builder artifact: $MATCH"
          grep -q 'IBSCBS' "$MATCH"
          grep -q 'IBSCBSTot' "$MATCH"
          grep -q 'vBCIBSCBS' "$MATCH"

      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/one-off-ibscbs-lib-update.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/thorfiscal-authorize/index.ts .github/workflows/one-off-ibscbs-lib-update.yml
          git commit -m "fix: generate IBS CBS groups with nfe 2.0.7 [skip-ibscbs-lib-update]"
          git push origin HEAD:main
