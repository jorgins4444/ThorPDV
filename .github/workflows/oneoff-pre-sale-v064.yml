name: One-off Pre-sale v0.6.4

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-pre-sale-v064.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply pre-sale receipt patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one match, got {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          replace_once(
              'desktop-pdv/main.js',
              "const { installProductionPrinting } = require('./agent/production');\n",
              "const { installProductionPrinting } = require('./agent/production');\nconst { installPreSaleReceipt } = require('./agent/pre-sale-v064');\n"
          )
          replace_once(
              'desktop-pdv/main.js',
              "installProductionPrinting(ThorAgent);\ninstallSyncPolicy(ThorAgent);",
              "installProductionPrinting(ThorAgent);\ninstallPreSaleReceipt(ThorAgent);\ninstallSyncPolicy(ThorAgent);"
          )
          replace_once('desktop-pdv/package.json', '"version": "0.6.3"', '"version": "0.6.4"')
      - name: Validate receipt module
        run: |
          node --check desktop-pdv/agent/pre-sale-v064.js
          node --check desktop-pdv/main.js
      - name: Commit patch
        run: |
          git config user.name "ThorPDV Automation"
          git config user.email "actions@users.noreply.github.com"
          git add desktop-pdv/main.js desktop-pdv/package.json
          git commit -m "feat: install redesigned non-fiscal pre-sale receipt v0.6.4"
          git push origin HEAD:main
