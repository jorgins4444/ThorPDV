name: One-off Menu v0.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-menu-v070.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add sales orders menu
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/app/dashboard/[...slug]/advanced-shell.tsx')
          s=p.read_text(encoding='utf-8')
          old="['Vendas',[['Operações de Caixa','/dashboard/vendas'],['Nova Venda','/dashboard/vendas/nova']]],"
          new="['Vendas',[['Operações de Caixa','/dashboard/vendas'],['Nova Venda','/dashboard/vendas/nova'],['Pedidos de Venda','/dashboard/vendas/pedidos']]],"
          if s.count(old)!=1: raise SystemExit('menu target not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "ThorPDV Automation"
          git config user.email "actions@users.noreply.github.com"
          git add 'src/app/dashboard/[...slug]/advanced-shell.tsx'
          git commit -m "feat: add sales orders to Vendas menu"
          git push origin HEAD:main
