name: Validate ThorPDV update helper Windows v082

on:
  push:
    branches: [feature/update-experience-v082]
    paths:
      - '.github/workflows/validate-update-helper-windows-v082.yml'

jobs:
  validate-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate updater JavaScript
        run: node --check desktop-pdv/updater.js
      - name: Export generated helper for validation
        shell: pwsh
        run: |
          Copy-Item desktop-pdv/updater.js updater-helper-test.js
          Add-Content updater-helper-test.js "module.exports.updateHelperScript = updateHelperScript;"
          node -e "const fs=require('fs'); const u=require('./updater-helper-test.js'); fs.writeFileSync('ThorPDV-Update-Helper.ps1', u.updateHelperScript(), 'utf8');"
      - name: Parse PowerShell helper
        shell: powershell
        run: |
          $content = Get-Content -Raw -LiteralPath 'ThorPDV-Update-Helper.ps1'
          $null = [ScriptBlock]::Create($content)
          Write-Host 'ThorPDV update helper PowerShell syntax OK'
      - name: Verify WPF assemblies exist
        shell: powershell
        run: |
          Add-Type -AssemblyName PresentationFramework
          Add-Type -AssemblyName PresentationCore
          Write-Host 'WPF assemblies OK'
