name: Validate daily cash transport v085

on:
  push:
    branches: [fix/daily-cash-existing-transport-v085]
    paths:
      - '.github/scripts/patch-daily-cash-transport-v085.py'
      - '.github/workflows/oneoff-daily-cash-transport-v085.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/daily-cash-existing-transport-v085
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply and commit 0.8.5 transport patch
        run: |
          python .github/scripts/patch-daily-cash-transport-v085.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-pdv/agent/sync.js desktop-pdv/agent/daily-cash-v083.js desktop-pdv/package.json
          if git diff --cached --quiet; then
            echo "No implementation changes"
          else
            git commit -m "fix: use deployed PDV push transport for daily cash"
            git push origin HEAD:fix/daily-cash-existing-transport-v085
          fi
      - name: Validate Desktop JavaScript
        run: |
          node --check desktop-pdv/agent/sync.js
          node --check desktop-pdv/agent/daily-cash-v083.js
          node --check desktop-pdv/main.js
          node --check desktop-pdv/renderer/cash-daily-v083.js
      - name: Validate route independence
        run: |
          ! grep -q '/api/pdv/cash/rollover' desktop-pdv/agent/sync.js
          ! grep -q '/api/pdv/cash/' desktop-pdv/agent/daily-cash-v083.js
          grep -q "cash_rollover" desktop-pdv/agent/sync.js
          grep -q "cash_sessions_query" desktop-pdv/agent/daily-cash-v083.js
      - name: Validate version
        run: node -e "const p=require('./desktop-pdv/package.json'); if(p.version!=='0.8.5') process.exit(1); console.log(p.version)"
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
