name: One-off ThorPDV update experience v082

on:
  push:
    branches: [feature/update-experience-v082]
    paths:
      - '.github/scripts/patch-update-experience-v082.py'
      - '.github/workflows/oneoff-update-experience-v082.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/update-experience-v082
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply v0.8.2 patch
        run: python .github/scripts/patch-update-experience-v082.py
      - name: Validate Desktop JavaScript
        run: |
          node --check desktop-pdv/main.js
          node --check desktop-pdv/updater.js
          node --check desktop-pdv/renderer/app.js
          node --check desktop-pdv/renderer/update-center.js
      - name: Validate Desktop version
        run: node -e "const p=require('./desktop-pdv/package.json'); if(p.version!=='0.8.2') process.exit(1); console.log('Desktop',p.version)"
      - name: Install web dependencies
        run: npm install
      - name: Typecheck web
        run: npm run typecheck
      - name: Build web
        run: npm run build
      - name: Lint web
        run: npm run lint
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-pdv/renderer/app.js desktop-pdv/main.js src/app/control/update-center.tsx
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
          else
            git commit -m "feat: preserve update session and structure release notes"
            git push origin HEAD:feature/update-experience-v082
          fi
