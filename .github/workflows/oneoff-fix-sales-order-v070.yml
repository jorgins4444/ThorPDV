name: One-off Fix Sales Order v0.7.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/oneoff-fix-sales-order-v070.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix JSX input
        shell: python
        run: |
          from pathlib import Path
          p=Path('src/app/dashboard/[...slug]/sales-order-workspace.tsx')
          s=p.read_text(encoding='utf-8')
          old='<input value={planName} onChange={e=>setPlanName(e.target.value)} placeholder="Ex.: Crediário 3x 30/60/90"></input>'
          new='<input value={planName} onChange={e=>setPlanName(e.target.value)} placeholder="Ex.: Crediário 3x 30/60/90"/>'
          if s.count(old)!=1: raise SystemExit('target not found')
          p.write_text(s.replace(old,new),encoding='utf-8')
      - name: Commit
        run: |
          git config user.name "ThorPDV Automation"
          git config user.email "actions@users.noreply.github.com"
          git add 'src/app/dashboard/[...slug]/sales-order-workspace.tsx'
          git commit -m "fix: close sales order plan input correctly"
          git push origin HEAD:main
