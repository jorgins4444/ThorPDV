name: One-off NFC-e fast and smooth

on:
  push:
    branches: [feat/nfce-fast-smooth-20260811]
    paths:
      - '.github/workflows/one-off-nfce-fast-smooth.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/nfce-fast-smooth-20260811
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Optimize ThorFiscal and Desktop UX
        shell: python
        run: |
          from pathlib import Path
          import re

          # 1) Desktop fiscal flow: remove duplicate full sync, poll local state quickly,
          #    keep a single recovery sync only if the background sync stalls.
          p = Path('desktop-pdv/renderer/app.js')
          s = p.read_text()

          progress_pattern = re.compile(r"function fiscalProgressSteps\(fiscal,phase\)\{[\s\S]*?\n\}\nfunction paintFiscalProgress\(m,sale,phase='waiting'\)\{[\s\S]*?\n\}\n\nasync function boot", re.M)
          progress_replacement = r'''function fiscalProgressSteps(fiscal,phase){
            const status=String(fiscal?.status||'requested');
            const phaseIndex={queueing:0,building:1,sending:2,waiting:3,done:3,printing:4,printed:5}[phase]??0;
            const authorized=status==='authorized';
            const rejected=status==='rejected';
            const failed=status==='transmission_error';
            const steps=[
              ['Preparando NFC-e',0],
              ['Assinando XML',1],
              ['Enviando à SEFAZ',2],
              ['Autorização',3],
              ['Impressão',4],
            ];
            return `<div class="fiscal-progress-steps smooth">${steps.map(([label,index])=>{
              const done=phase==='printed'||index<phaseIndex||(index===3&&(authorized||rejected))||(index===2&&(authorized||rejected||failed));
              const active=!done&&index===Math.min(phaseIndex,4)&&!(rejected||failed);
              const error=(rejected||failed)&&index===3;
              return `<div class="fiscal-progress-step ${done?'done':''} ${active?'active':''} ${error?'error':''}"><i>${done?'✓':error?'!':''}</i><span>${label}</span></div>`;
            }).join('')}</div>`;
          }
          function paintFiscalProgress(m,sale,phase='waiting'){
            if(!m?.isConnected)return;
            if(!m.dataset.fiscalStartedAt)m.dataset.fiscalStartedAt=String(Date.now());
            const startedAt=Number(m.dataset.fiscalStartedAt||Date.now());
            const elapsed=Math.max(0,Date.now()-startedAt);
            const fiscal=sale?.fiscal||{status:'requested'};
            const status=String(fiscal.status||'requested');
            const isError=status==='rejected'||status==='transmission_error';
            const pctMap={queueing:10,building:30,sending:56,waiting:76,done:88,printing:94,printed:100};
            const pct=isError?82:(pctMap[phase]??18);
            let title='Preparando NFC-e';
            let subtitle='Organizando os dados fiscais da venda.';
            if(phase==='building'){title='Gerando e assinando XML';subtitle='Aplicando certificado A1 e chave de acesso.';}
            if(phase==='sending'){title='Enviando para a SEFAZ';subtitle='Conexão segura com o autorizador fiscal.';}
            if(phase==='waiting'){title='Aguardando autorização';subtitle='A SEFAZ está validando a NFC-e.';}
            if(status==='authorized'){title=phase==='printing'?'NFC-e autorizada — imprimindo':phase==='printed'?'NFC-e autorizada e impressa':'NFC-e autorizada';subtitle=phase==='printing'?'Preparando o DANFE e enviando para a impressora.':phase==='printed'?'Documento fiscal concluído com sucesso.':'Autorização concluída. Preparando a impressão.';}
            if(status==='rejected'){title='NFC-e rejeitada';subtitle=fiscalReason(fiscal)||'A SEFAZ rejeitou o documento.';}
            if(status==='transmission_error'){title='Falha no envio da NFC-e';subtitle=fiscalReason(fiscal)||'Não foi possível concluir a comunicação fiscal.';}
            const stopped=isError||phase==='printed';
            const details=isError?`<details class="fiscal-progress-details"><summary>Ver detalhes da transmissão</summary>${fiscalTimelineHtml(fiscal)}</details>`:'';
            const body=m.querySelector('#fiscalProgressBody');if(!body)return;
            body.innerHTML=`<div class="fiscal-progress-head smooth"><div class="fiscal-spinner ${stopped?'stopped':''} ${phase==='printed'?'success':''}">${phase==='printed'?'✓':''}</div><div><small>THORFISCAL / SEFAZ</small><h3>${esc(title)}</h3><p>${esc(subtitle)}</p></div><span class="fiscal-elapsed">${(elapsed/1000).toFixed(1)}s</span></div><div class="fiscal-flight"><div class="fiscal-flight-fill" style="width:${pct}%"></div><div class="fiscal-flight-glow" style="left:${Math.max(pct-2,0)}%"></div></div>${fiscalProgressSteps(fiscal,phase)}${isError?fiscalDiagnosticHtml(fiscal):''}<div class="fiscal-progress-meta"><span>Chave: <b>${esc(fiscal.access_key||'gerando...')}</b></span>${fiscal.protocol?`<span>Protocolo: <b>${esc(fiscal.protocol)}</b></span>`:''}${fiscalCode(fiscal)?`<span>cStat: <b>${esc(fiscalCode(fiscal))}</b></span>`:''}</div>${details}<div class="actions" id="fiscalProgressActions"></div>`;
            const actions=body.querySelector('#fiscalProgressActions');
            if(isError){
              actions.innerHTML='<button class="secondary" id="fiscalClose">Fechar</button><button class="primary" id="fiscalRetry">Tentar novamente</button>';
              actions.querySelector('#fiscalClose').onclick=()=>m.remove();
              actions.querySelector('#fiscalRetry').onclick=()=>{m.remove();requestNfceAndMaybePrint(saleKey(sale));};
            }else if(phase==='printed'){
              actions.innerHTML='<button class="primary" id="fiscalClose">Concluir</button>';
              actions.querySelector('#fiscalClose').onclick=()=>m.remove();
            }
          }

          async function boot'''
          s, count = progress_pattern.subn(progress_replacement, s, count=1)
          if count != 1:
            raise SystemExit('progress functions block not found')

          request_pattern = re.compile(r"async function requestNfceAndMaybePrint\(key\)\{[\s\S]*?\n\}\n\nasync function safePrint", re.M)
          request_replacement = r'''async function requestNfceAndMaybePrint(key){
            const m=modal('<div id="fiscalProgressBody"></div>','wide');
            m.dataset.fiscalStartedAt=String(Date.now());
            paintFiscalProgress(m,{fiscal:{status:'requested',events:[]}},'queueing');
            try{
              const requested=await window.thor.requestNfce({saleKey:key});
              if(requested.alreadyAuthorized){
                const done=await window.thor.fiscalSale(key);
                paintFiscalProgress(m,done,'printing');
                const printed=await safePrint(key,'nfce');
                paintFiscalProgress(m,done,printed?'printed':'done');
                if(printed)setTimeout(()=>{if(m.isConnected)m.remove();},1400);
                return;
              }

              const started=Date.now();
              const deadline=started+45000;
              let sale=null;
              let recoveryTriggered=false;
              while(Date.now()<deadline){
                const elapsed=Date.now()-started;
                const visualPhase=elapsed<450?'building':elapsed<1250?'sending':'waiting';
                try{sale=await window.thor.fiscalSale(key);}catch{}
                paintFiscalProgress(m,sale||{fiscal:{status:'processing',events:[]}},visualPhase);
                const status=String(sale?.fiscal?.status||'');
                if(fiscalTerminalStatuses.has(status))break;

                // requestNfce already starts the background sync. Do not force a second
                // full push/pull/heartbeat cycle here. Only recover if it genuinely stalls.
                if(!recoveryTriggered&&elapsed>5500){
                  recoveryTriggered=true;
                  window.thor.sync().catch(()=>{});
                }
                await wait(180);
              }

              if(!sale){try{sale=await window.thor.fiscalSale(key);}catch{}}
              const status=String(sale?.fiscal?.status||'');
              if(status==='authorized'){
                await refreshFiscalSales();
                paintFiscalProgress(m,sale,'printing');
                await wait(120);
                const printed=await safePrint(key,'nfce');
                paintFiscalProgress(m,sale,printed?'printed':'done');
                if(printed)setTimeout(()=>{if(m.isConnected)m.remove();},1400);
                return;
              }
              if(status==='rejected'||status==='transmission_error'){
                await refreshFiscalSales();
                paintFiscalProgress(m,sale,'waiting');
                return;
              }

              const actions=m.querySelector('#fiscalProgressActions');
              if(actions){actions.innerHTML='<button class="secondary" id="fiscalClose">Fechar</button><button class="primary" id="fiscalRefreshNow">Atualizar agora</button>';actions.querySelector('#fiscalClose').onclick=()=>m.remove();actions.querySelector('#fiscalRefreshNow').onclick=async()=>{window.thor.sync().catch(()=>{});await wait(250);const current=await window.thor.fiscalSale(key);paintFiscalProgress(m,current,'waiting');};}
              const body=m.querySelector('#fiscalProgressBody');
              if(body&&!body.querySelector('.fiscal-timeout-note'))body.insertAdjacentHTML('beforeend','<div class="fiscal-diagnostic warning fiscal-timeout-note"><b>A autorização continua sendo acompanhada</b><span>O retorno ainda não foi concluído. Você pode atualizar agora sem gerar outra numeração.</span></div>');
            }catch(e){
              const body=m.querySelector('#fiscalProgressBody');if(body)body.innerHTML=`<h3>Falha ao iniciar NFC-e</h3><div class="fiscal-diagnostic error"><b>Não foi possível iniciar a transmissão</b><span>${esc(friendlyError(e.message))}</span></div><div class="actions"><button class="primary" id="fiscalClose">Fechar</button></div>`;
              m.querySelector('#fiscalClose')?.addEventListener('click',()=>m.remove());
            }
          }

          async function safePrint'''
          s, count = request_pattern.subn(request_replacement, s, count=1)
          if count != 1:
            raise SystemExit('requestNfceAndMaybePrint block not found')

          safe_pattern = re.compile(r"async function safePrint\(key,type\)\{[\s\S]*?\n\}\n\nfunction renderFiscalWorkspace", re.M)
          safe_replacement = r'''async function safePrint(key,type){
            try{
              const r=await window.thor.printSale(key,type);
              if(r?.cancelled)return false;
              showToast(type==='nfce'?'NFC-e enviada para impressão.':'Comprovante enviado para impressão.');
              return true;
            }catch(e){
              if(e.message==='printer_not_configured')infoModal('Impressora não configurada','Abra Configurações (F12), escolha uma impressora instalada no Windows ou “Salvar como PDF”.');
              else infoModal('Impressão',friendlyError(e.message));
              return false;
            }
          }

          function renderFiscalWorkspace'''
          s, count = safe_pattern.subn(safe_replacement, s, count=1)
          if count != 1:
            raise SystemExit('safePrint block not found')
          p.write_text(s)

          # 2) Add smoother visual feedback without hiding real errors/status.
          css = Path('desktop-pdv/renderer/styles.css')
          c = css.read_text()
          marker = '/* nfce fast smooth v077 */'
          if marker not in c:
            c += r'''

          /* nfce fast smooth v077 */
          .fiscal-progress-head.smooth{position:relative;padding-right:72px}.fiscal-elapsed{position:absolute;right:0;top:50%;transform:translateY(-50%);font-size:12px;font-weight:900;color:#607068;background:#f2f6f4;border:1px solid #e0e8e3;border-radius:999px;padding:7px 9px;min-width:56px;text-align:center;font-variant-numeric:tabular-nums}.fiscal-flight{height:7px;position:relative;overflow:hidden;border-radius:999px;background:#edf2ef;margin:18px 0 4px}.fiscal-flight-fill{height:100%;border-radius:inherit;background:linear-gradient(90deg,#19834b,#37a96b);transition:width .35s cubic-bezier(.2,.8,.2,1)}.fiscal-flight-glow{position:absolute;top:50%;width:26px;height:26px;border-radius:50%;transform:translate(-50%,-50%);background:#49b67a33;box-shadow:0 0 20px #39a86d66;transition:left .35s cubic-bezier(.2,.8,.2,1);animation:fiscalGlow 1.2s ease-in-out infinite}.fiscal-progress-steps.smooth{margin-top:12px}.fiscal-progress-steps.smooth .fiscal-progress-step{position:relative;overflow:hidden;transition:border-color .25s,background .25s,color .25s,transform .25s}.fiscal-progress-steps.smooth .fiscal-progress-step.active{transform:translateY(-2px);box-shadow:0 8px 20px #b8832630}.fiscal-progress-steps.smooth .fiscal-progress-step.active:after{content:'';position:absolute;inset:0;background:linear-gradient(100deg,transparent 20%,#fff8 50%,transparent 80%);transform:translateX(-120%);animation:fiscalSweep 1.35s linear infinite}.fiscal-progress-step.error{border-color:#efb7bc;background:#fff1f2;color:#9e2933}.fiscal-progress-step.error i{border-color:#d44955;color:#b52d39}.fiscal-spinner.success{display:grid;place-items:center;border:0;background:#19834b;color:#fff;font-size:22px;font-weight:900;animation:fiscalPop .38s ease-out}.fiscal-progress-details{margin-top:12px;border:1px solid #e3e9e5;border-radius:10px;background:#fafcfb;padding:8px 10px}.fiscal-progress-details summary{cursor:pointer;font-size:11px;font-weight:850;color:#66736c}.fiscal-progress-details .fiscal-event-list{margin-top:9px}.fiscal-timeout-note{margin-top:14px}@keyframes fiscalGlow{50%{transform:translate(-50%,-50%) scale(1.35);opacity:.45}}@keyframes fiscalSweep{to{transform:translateX(120%)}}@keyframes fiscalPop{0%{transform:scale(.72);opacity:.2}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
          '''
          css.write_text(c)

          # 3) ThorFiscal: buffer audit events and flush once. This preserves the log
          #    while removing many sequential DB roundtrips from the authorization path.
          p = Path('supabase/functions/thorfiscal-authorize/index.ts')
          s = p.read_text()
          event_pattern = re.compile(r"async function fiscalEvent\([\s\S]*?\n\}\n\nfunction buildNfeProc", re.M)
          event_replacement = r'''type PendingFiscalEvent = {
            event_type: string;
            level: "info" | "success" | "warning" | "error";
            code: string | null;
            message: string;
            payload: Json;
            created_at: string;
          };

          function queueFiscalEvent(
            buffer: PendingFiscalEvent[],
            eventType: string,
            level: "info" | "success" | "warning" | "error",
            message: string,
            code?: string,
            payload: Json = {},
          ) {
            buffer.push({
              event_type: eventType,
              level,
              code: code || null,
              message,
              payload,
              created_at: new Date().toISOString(),
            });
          }

          async function flushFiscalEvents(
            supabase: any,
            tenantId: string,
            documentId: string,
            buffer: PendingFiscalEvent[],
          ) {
            if (!tenantId || !documentId || !buffer.length) return;
            const rows = buffer.splice(0).map((event) => ({
              tenant_id: tenantId,
              fiscal_document_id: documentId,
              ...event,
            }));
            const { error } = await supabase.from("fiscal_document_events").insert(rows);
            if (error) console.error("fiscal_event_batch_insert_failed", error.message);
          }

          function buildNfeProc'''
          s, count = event_pattern.subn(event_replacement, s, count=1)
          if count != 1:
            raise SystemExit('fiscalEvent function block not found')

          tenant_marker = '  const tenantId = str(doc.tenant_id);\n'
          if tenant_marker not in s:
            raise SystemExit('tenantId marker not found')
          s = s.replace(tenant_marker, tenant_marker + '  const eventBuffer: PendingFiscalEvent[] = [];\n', 1)

          s = s.replace('await fiscalEvent(supabase, tenantId, documentId, ', 'queueFiscalEvent(eventBuffer, ')
          s = s.replace('await fiscalEvent(\n      supabase,\n      tenantId,\n      documentId,\n', 'queueFiscalEvent(\n      eventBuffer,\n')
          if 'await fiscalEvent(' in s:
            raise SystemExit('unconverted fiscalEvent await remains')

          authorized_marker = '      queueFiscalEvent(eventBuffer, "authorized", "success", result.xMotivo || "NFC-e autorizada pela SEFAZ.", result.cStat || "100", { protocol: result.nProt || null, access_key: result.chNFe || accessKey });\n\n      return json({'
          if authorized_marker not in s:
            raise SystemExit('authorized event marker not found')
          s = s.replace(authorized_marker, authorized_marker.replace('\n\n      return json({', '\n      await flushFiscalEvents(supabase, tenantId, documentId, eventBuffer);\n\n      return json({'), 1)

          rejected_marker = '    queueFiscalEvent(eventBuffer, "rejected", "error", result.xMotivo || "NFC-e rejeitada pela SEFAZ.", result.cStat || "unknown", { access_key: accessKey, endpoint: transmitted.url });\n\n    return json({'
          if rejected_marker not in s:
            raise SystemExit('rejected event marker not found')
          s = s.replace(rejected_marker, rejected_marker.replace('\n\n    return json({', '\n    await flushFiscalEvents(supabase, tenantId, documentId, eventBuffer);\n\n    return json({'), 1)

          catch_return = '    return json({\n      ok: false,\n      authorized: false,\n      status,'
          if catch_return not in s:
            raise SystemExit('catch return marker not found')
          s = s.replace(catch_return, '    await flushFiscalEvents(supabase, tenantId, documentId, eventBuffer);\n\n' + catch_return, 1)
          p.write_text(s)

          # 4) New Desktop build.
          p = Path('desktop-pdv/package.json')
          s = p.read_text()
          if '"version": "0.7.6"' not in s:
            raise SystemExit('desktop version 0.7.6 not found')
          p.write_text(s.replace('"version": "0.7.6"', '"version": "0.7.7"', 1))

      - name: Validate Desktop JavaScript
        run: |
          node --check desktop-pdv/renderer/app.js
          node --check desktop-pdv/main.js
          node --check desktop-pdv/agent/index.js
          node -e "const p=require('./desktop-pdv/package.json'); if(p.version!=='0.7.7') process.exit(1)"

      - name: Validate ThorFiscal Edge Function
        run: deno check supabase/functions/thorfiscal-authorize/index.ts

      - name: Validate web app
        run: |
          npm install
          npm run typecheck
          npm run build
          npm run lint

      - name: Commit optimization and cleanup
        run: |
          rm .github/workflows/one-off-nfce-fast-smooth.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-pdv supabase/functions/thorfiscal-authorize/index.ts .github/workflows/one-off-nfce-fast-smooth.yml
          git commit -m "perf: accelerate NFC-e authorization and smooth print flow"
          git push origin HEAD:feat/nfce-fast-smooth-20260811
