name: One-off fix NFC-e cancellation endpoint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-fix-nfce-cancel-endpoint.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Force SVRS NFC-e event endpoint
        shell: python
        run: |
          from pathlib import Path
          p = Path('supabase/functions/thorfiscal-cancel/index.ts')
          s = p.read_text()
          old = '        endpoint = str(sefazRequest.url);\n        requestEnvelope = str(sefazRequest.xml);'
          new = '''        const libraryEndpoint = str(sefazRequest.url);\n        endpoint = environment === "production"\n          ? "https://nfce.svrs.rs.gov.br/ws/recepcaoevento/recepcaoevento4.asmx"\n          : "https://nfce-homologacao.svrs.rs.gov.br/ws/recepcaoevento/recepcaoevento4.asmx";\n        requestEnvelope = str(sefazRequest.xml);\n        if (libraryEndpoint !== endpoint) {\n          console.log("ThorFiscal NFC-e cancellation endpoint override", { libraryEndpoint, endpoint });\n        }'''
          if old not in s:
              raise SystemExit('target transport block not found')
          p.write_text(s.replace(old, new, 1))
      - name: Validate Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/thorfiscal-cancel/index.ts
      - name: Commit fix and cleanup workflow
        run: |
          rm .github/workflows/one-off-fix-nfce-cancel-endpoint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/thorfiscal-cancel/index.ts .github/workflows/one-off-fix-nfce-cancel-endpoint.yml
          git commit -m "fix: route NFC-e cancellation to SVRS model 65 endpoint"
          git push
