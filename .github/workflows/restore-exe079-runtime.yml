name: Restore ThorPDV runtime from stable 0.8.79

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-exe079-runtime.yml'

permissions:
  contents: write

jobs:
  restore-runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - id: checkout
        name: Checkout isolated restore branch
        uses: actions/checkout@v4
        with:
          ref: restore/exe079-runtime
          fetch-depth: 0

      - id: tools
        name: Install extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools rsync
          npm install --no-save @electron/asar@3.2.10

      - id: download
        name: Download and verify known-good 0.8.79 installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/stable"
          gh release download pdv-v0.8.79 --pattern 'ThorPDV-Desktop-0.8.79-x64.exe' --dir "$RUNNER_TEMP/stable"
          EXE="$RUNNER_TEMP/stable/ThorPDV-Desktop-0.8.79-x64.exe"
          ACTUAL=$(sha256sum "$EXE" | awk '{print $1}')
          EXPECTED='631621d0164e5f924e0f2dc63626a02219ade6c1af619fcd98278473f416d512'
          echo "Installer SHA256: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"

      - id: extract
        name: Extract exact app.asar
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/extract-stage.txt"
          echo 'start' > "$STAGE"
          PAYLOAD="$RUNNER_TEMP/stable/payload.7z"
          mkdir -p "$RUNNER_TEMP/unpacked" "$RUNNER_TEMP/stable-app"
          python <<'PY'
          import os
          from pathlib import Path
          exe=Path(os.environ['RUNNER_TEMP'])/'stable'/'ThorPDV-Desktop-0.8.79-x64.exe'
          payload=Path(os.environ['RUNNER_TEMP'])/'stable'/'payload.7z'
          data=exe.read_bytes()
          magic=b'\x37\x7a\xbc\xaf\x27\x1c'
          offset=data.find(magic)
          if offset < 0:
              raise SystemExit('embedded 7z payload not found')
          payload.write_bytes(data[offset:])
          print('Embedded 7z payload offset:', offset)
          PY
          echo 'payload-sliced' > "$STAGE"
          bsdtar -xf "$PAYLOAD" -C "$RUNNER_TEMP/unpacked"
          echo 'payload-extracted' > "$STAGE"
          ASAR=$(find "$RUNNER_TEMP/unpacked" -type f -path '*/resources/app.asar' | head -1)
          if [ -z "$ASAR" ]; then
            echo 'asar-not-found' > "$STAGE"
            find "$RUNNER_TEMP/unpacked" -maxdepth 4 -type f | head -150
            exit 1
          fi
          echo "asar-found:$ASAR" > "$STAGE"
          ./node_modules/.bin/asar extract "$ASAR" "$RUNNER_TEMP/stable-app"
          echo 'asar-extracted' > "$STAGE"
          node -e "const p=require(process.env.RUNNER_TEMP+'/stable-app/package.json'); if(p.version!=='0.8.79') process.exit(1); console.log('Stable runtime',p.version)"
          test -f "$RUNNER_TEMP/stable-app/renderer/thorpdv.bundle.js"
          test -f "$RUNNER_TEMP/stable-app/renderer/thorpdv.bundle.css"
          test -f "$RUNNER_TEMP/stable-app/agent/sync-request-worker.js"
          test -f "$RUNNER_TEMP/stable-app/agent/sqlite-optimization-v124.js"
          echo 'verified' > "$STAGE"

      - id: reconstruct
        name: Reconstruct desktop source from installer runtime
        run: |
          cp desktop-pdv/package.json "$RUNNER_TEMP/build-package.json"
          rm -rf desktop-pdv
          mkdir -p desktop-pdv
          rsync -a --exclude='node_modules/' "$RUNNER_TEMP/stable-app/" desktop-pdv/
          node <<'NODE'
          const fs=require('fs');
          const stable=JSON.parse(fs.readFileSync('desktop-pdv/package.json','utf8'));
          const previous=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/build-package.json','utf8'));
          stable.version='0.8.86';
          stable.scripts={dev:'electron .',start:'electron .','dist:win':'electron-builder --win nsis','pack:win':'electron-builder --win dir'};
          stable.dependencies=stable.dependencies||{};
          stable.dependencies['better-sqlite3']='12.4.1';
          stable.devDependencies=previous.devDependencies||{electron:'latest','electron-builder':'latest'};
          stable.build={appId:'br.com.thorpdv.desktop',productName:'ThorPDV Desktop',artifactName:'ThorPDV-Desktop-${version}-${arch}.${ext}',files:['main-v090.js','main.js','preload.js','ipc-store-credit-v105.js','ipc-receivable-v115.js','updater.js','agent/**/*','renderer/**/*','package.json'],npmRebuild:true,asar:true,win:{target:['nsis']},nsis:{oneClick:false,allowToChangeInstallationDirectory:true,createDesktopShortcut:true,createStartMenuShortcut:true}};
          fs.writeFileSync('desktop-pdv/package.json',JSON.stringify(stable,null,2)+'\n');
          NODE

      - id: verify
        name: Prove entry and sync are the stable architecture
        run: |
          set -euo pipefail
          grep -q 'thorpdv.bundle.css' desktop-pdv/renderer/index.html
          grep -q 'thorpdv.bundle.js' desktop-pdv/renderer/index.html
          ! grep -q 'login-entry-v108' desktop-pdv/renderer/index.html
          ! grep -q 'setup-flow-v109' desktop-pdv/renderer/index.html
          grep -q 'sync-request-worker.js' desktop-pdv/agent/sync.js
          grep -q 'worker_threads' desktop-pdv/agent/sync.js
          grep -q 'sqlite-optimization-v124' desktop-pdv/main-v090.js
          ! grep -q 'product-catalog-read' desktop-pdv/main-v090.js
          node --check desktop-pdv/main-v090.js
          node --check desktop-pdv/main.js
          node --check desktop-pdv/preload.js
          node --check desktop-pdv/agent/sync.js
          node --check desktop-pdv/agent/sync-request-worker.js

      - id: commit
        name: Commit exact reconstructed runtime to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-pdv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'restore(desktop): reconstruct runtime from stable 0.8.79 installer'
          git push origin HEAD:restore/exe079-runtime

      - name: Persist restore diagnostic
        if: always()
        run: |
          STAGE=$(cat "$RUNNER_TEMP/extract-stage.txt" 2>/dev/null || echo 'not-started')
          printf 'run_id=%s\nextract_stage=%s\ncheckout=%s\ntools=%s\ndownload=%s\nextract=%s\nreconstruct=%s\nverify=%s\ncommit=%s\n' \
            '${{ github.run_id }}' "$STAGE" '${{ steps.checkout.outcome }}' '${{ steps.tools.outcome }}' '${{ steps.download.outcome }}' '${{ steps.extract.outcome }}' \
            '${{ steps.reconstruct.outcome }}' '${{ steps.verify.outcome }}' '${{ steps.commit.outcome }}' > restore-exe079-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add restore-exe079-diagnostic.txt
          git commit -m 'chore: record stable runtime restore diagnostic' || true
          git push origin HEAD:restore/exe079-runtime || true
