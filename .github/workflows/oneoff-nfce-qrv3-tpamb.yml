name: One-off NFC-e QRv3 tpAmb Fix

on:
  push:
    paths:
      - '.github/workflows/oneoff-nfce-qrv3-tpamb.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore tpAmb in QR-Code v3
        shell: python
        run: |
          from pathlib import Path
          p = Path('supabase/functions/thorfiscal-authorize/index.ts')
          s = p.read_text(encoding='utf-8')
          old = '''function insertQrV3(signedXml: string, uf: string, homologation: boolean, accessKey: string) {'''
          new = '''function insertQrV3(signedXml: string, uf: string, homologation: boolean, tpAmb: number, accessKey: string) {'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''  // NT 2025.001 - QR-Code v3, emissão on-line (tpEmis=1):\n  // <chave_acesso>|3|  -- sem CSC e sem tpAmb no conteúdo do QR-Code v3.\n  const qr = `${qrBase}${qrBase.includes("?") ? "&" : "?"}p=${accessKey}|3|`;'''
          new = '''  // NT 2025.001 / MOC vigente: no QR-Code v3, tpAmb continua sendo o 3º parâmetro.\n  // Emissão on-line (tpEmis=1): <chave_acesso>|3|<tpAmb>, sem CSC/hash.\n  const qr = `${qrBase}${qrBase.includes("?") ? "&" : "?"}p=${accessKey}|3|${tpAmb}`;'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          old = '''const withQr = insertQrV3(signedBase, built.uf, built.homologation, accessKey);'''
          new = '''const withQr = insertQrV3(signedBase, built.uf, built.homologation, built.environment, accessKey);'''
          assert s.count(old) == 1
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Validate QR-Code v3 contract
        shell: bash
        run: |
          grep -F 'p=${accessKey}|3|${tpAmb}' supabase/functions/thorfiscal-authorize/index.ts
          python3 - <<'PY'
          from pathlib import Path
          s=Path('supabase/functions/thorfiscal-authorize/index.ts').read_text()
          a=s.index('const supl = `<infNFeSupl>')
          b=s.index('const signature = /<(?:\\w+:)?Signature\\b/')
          assert a < b
          print('QR v3 tpAmb restored; infNFeSupl ordering preserved')
          PY
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check ThorFiscal
        run: deno check --node-modules-dir=auto supabase/functions/thorfiscal-authorize/index.ts
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name 'ThorPDV Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/thorfiscal-authorize/index.ts
          git commit -m 'fix: restore tpAmb in NFC-e QR-Code v3'
          git push
