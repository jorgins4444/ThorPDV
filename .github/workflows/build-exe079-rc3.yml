name: Build restored 0.8.79 runtime RC3

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-exe079-rc3.yml'

permissions:
  contents: write

jobs:
  windows-rc:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          ref: restore/exe079-runtime
          fetch-depth: 0

      - name: Preserve exact source bytes
        shell: pwsh
        run: |
          git config core.autocrlf false
          git reset --hard HEAD

      - id: stable
        name: Verify stable runtime and build configuration
        shell: pwsh
        run: |
          $expected = @{
            'desktop-pdv/renderer/index.html'='caac5189223af560596f141f6a04ff9113149c03f7aa5225210f58662f816e41'
            'desktop-pdv/renderer/thorpdv.bundle.js'='5a4919272f1ee3cd1a78160cd2c27888be21e03457169eac85b87eb080fd1df9'
            'desktop-pdv/renderer/thorpdv.bundle.css'='e4e7991bc67355197b6db92176a236230a3cc062c1d5746cfc36a737882f532a'
            'desktop-pdv/agent/sync.js'='722150b7932e7dc4d42f2f079e6c56e58fb840c80658420c9a38b34129d63fc6'
            'desktop-pdv/agent/sync-request-worker.js'='ce7b8ced067ae7077ab60f6aa214369021ce79743fcca704e5942b0f9b4ab940'
            'desktop-pdv/agent/store.js'='f106a649f35b52a7390ca3170c13c42074d753b9b14082a78f00f2820b35ffb1'
            'desktop-pdv/main-v090.js'='97e1541b49f075ca403ce71a81f5097502dc9631ac617d40fa89c10a803aaad8'
            'desktop-pdv/main.js'='2bab08eee16e379e7704e911f503caa3275fdf1b548232277860f49e69f9c267'
            'desktop-pdv/preload.js'='d5a01b049ab932b561e870cb3b401b24b01578af429ac9e2671a130ebe143d8c'
            'desktop-pdv/updater.js'='ef97055111bd79f98328a06e534c18b2d72eb5a30410a3104ffa34438f34259e'
          }
          foreach($p in $expected.Keys){
            $h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
            if($h -ne $expected[$p]){throw "Stable file mismatch: $p $h"}
          }
          $pkg=Get-Content desktop-pdv/package.json | ConvertFrom-Json
          if($pkg.version -ne '0.8.86'){throw 'Unexpected RC version'}
          if($pkg.dependencies.'better-sqlite3' -ne '13.0.3'){throw 'SQLite package must match stable EXE 13.0.3'}
          if($pkg.build.npmRebuild -ne $false){throw 'Native rebuild must remain disabled'}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - id: install
        name: Install exact runtime dependencies
        working-directory: desktop-pdv
        run: npm install

      - id: sqlite
        name: Verify SQLite binary from stable package
        working-directory: desktop-pdv
        shell: pwsh
        run: |
          $pkg=Get-Content node_modules\better-sqlite3\package.json | ConvertFrom-Json
          if($pkg.version -ne '13.0.3'){throw "Installed SQLite package is $($pkg.version)"}
          $native='node_modules\better-sqlite3\prebuilds\win32-x64.node'
          if(-not(Test-Path $native)){throw 'Stable SQLite prebuild not present'}
          $h=(Get-FileHash $native -Algorithm SHA256).Hash.ToLower()
          if($h -ne 'e21e5efd71fba66578e95b62554d9028064a80dafd7221bf8a8ef155de8d240a'){throw "Stable SQLite binary mismatch: $h"}
          $env:ELECTRON_RUN_AS_NODE='1'
          & .\node_modules\electron\dist\electron.exe -e "const Database=require('better-sqlite3');const db=new Database(':memory:');db.exec('create table t(v);insert into t values(79)');if(db.prepare('select v from t').get().v!==79)process.exit(2);console.log(JSON.stringify(process.versions));db.close();"
          if($LASTEXITCODE -ne 0){throw "SQLite failed under Electron: $LASTEXITCODE"}
          Remove-Item Env:ELECTRON_RUN_AS_NODE

      - id: syntax
        name: Validate stable JavaScript
        working-directory: desktop-pdv
        shell: pwsh
        run: |
          foreach($f in @('main-v090.js','main.js','preload.js','updater.js','agent/store.js','agent/sync.js','agent/sync-request-worker.js','agent/sqlite-optimization-v124.js')){node --check $f;if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}}

      - id: build
        name: Package Windows RC without native rebuild
        working-directory: desktop-pdv
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:win

      - id: packaged
        name: Verify packaged stable runtime
        working-directory: desktop-pdv
        shell: pwsh
        run: |
          $asar='dist\win-unpacked\resources\app.asar'
          if(-not(Test-Path $asar)){throw 'Packaged app.asar missing'}
          $out="$env:RUNNER_TEMP\packaged"
          npx --yes @electron/asar@3.2.10 extract $asar $out
          $checks=@{
            "$out\renderer\index.html"='caac5189223af560596f141f6a04ff9113149c03f7aa5225210f58662f816e41'
            "$out\renderer\thorpdv.bundle.js"='5a4919272f1ee3cd1a78160cd2c27888be21e03457169eac85b87eb080fd1df9'
            "$out\agent\sync.js"='722150b7932e7dc4d42f2f079e6c56e58fb840c80658420c9a38b34129d63fc6'
            "$out\agent\sync-request-worker.js"='ce7b8ced067ae7077ab60f6aa214369021ce79743fcca704e5942b0f9b4ab940'
            "$out\agent\store.js"='f106a649f35b52a7390ca3170c13c42074d753b9b14082a78f00f2820b35ffb1'
            "$out\main-v090.js"='97e1541b49f075ca403ce71a81f5097502dc9631ac617d40fa89c10a803aaad8'
            "$out\main.js"='2bab08eee16e379e7704e911f503caa3275fdf1b548232277860f49e69f9c267'
            "$out\preload.js"='d5a01b049ab932b561e870cb3b401b24b01578af429ac9e2671a130ebe143d8c'
            "$out\updater.js"='ef97055111bd79f98328a06e534c18b2d72eb5a30410a3104ffa34438f34259e'
          }
          foreach($p in $checks.Keys){$h=(Get-FileHash $p -Algorithm SHA256).Hash.ToLower();if($h -ne $checks[$p]){throw "Packaged stable file changed: $p $h"}}
          $native='dist\win-unpacked\resources\app.asar.unpacked\node_modules\better-sqlite3\prebuilds\win32-x64.node'
          if(-not(Test-Path $native)){throw 'Packaged SQLite prebuild missing'}
          $h=(Get-FileHash $native -Algorithm SHA256).Hash.ToLower()
          if($h -ne 'e21e5efd71fba66578e95b62554d9028064a80dafd7221bf8a8ef155de8d240a'){throw "Packaged SQLite changed: $h"}

      - id: checksum
        name: Create checksum
        working-directory: desktop-pdv
        shell: pwsh
        run: |
          $exe=Get-ChildItem dist\ThorPDV-Desktop-0.8.86-x64.exe | Select-Object -First 1
          if(-not $exe){throw 'RC installer missing'}
          $h=(Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          Set-Content ($exe.FullName+'.sha256') ($h+'  '+$exe.Name) -Encoding ascii
          "sha256=$h" | Out-File $env:GITHUB_OUTPUT -Append

      - id: publish
        name: Publish isolated RC
        working-directory: desktop-pdv
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag='pdv-v0.8.86-rc1'
          $exe=Get-ChildItem dist\ThorPDV-Desktop-0.8.86-x64.exe | Select-Object -First 1
          $sha=$exe.FullName+'.sha256'
          gh release view $tag 2>$null | Out-Null
          if($LASTEXITCODE -ne 0){gh release create $tag --target restore/exe079-runtime --title 'ThorPDV Desktop 0.8.86 RC1' --notes 'RC isolada reconstruída do EXE estável 0.8.79. Não cadastrada no ThorControl.'}
          gh release upload $tag $exe.FullName $sha --clobber

      - name: Record diagnostic
        if: always()
        shell: pwsh
        run: |
          @"
          run_id=${{ github.run_id }}
          stable=${{ steps.stable.outcome }}
          install=${{ steps.install.outcome }}
          sqlite=${{ steps.sqlite.outcome }}
          syntax=${{ steps.syntax.outcome }}
          build=${{ steps.build.outcome }}
          packaged=${{ steps.packaged.outcome }}
          checksum=${{ steps.checksum.outcome }}
          publish=${{ steps.publish.outcome }}
          sha256=${{ steps.checksum.outputs.sha256 }}
          "@ | Set-Content build-exe079-rc3-diagnostic.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-exe079-rc3-diagnostic.txt
          git commit -m 'chore: record restored runtime RC3 diagnostic' 2>$null
          git push origin HEAD:restore/exe079-runtime
