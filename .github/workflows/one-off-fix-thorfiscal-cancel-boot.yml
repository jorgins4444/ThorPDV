name: One-off fix ThorFiscal cancellation boot

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-off-fix-thorfiscal-cancel-boot.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Bundle ICP-Brasil root in Edge Function
        shell: python
        run: |
          from pathlib import Path
          target = Path('supabase/functions/thorfiscal-cancel/index.ts')
          pem = Path('supabase/functions/thorfiscal-cancel/icp-brasil-v10.pem').read_text(encoding='utf-8').strip()
          text = target.read_text(encoding='utf-8')
          old = 'const ICP_BRASIL_ROOT_V10_PEM = await Deno.readTextFile(new URL("./icp-brasil-v10.pem", import.meta.url));'
          new = 'const ICP_BRASIL_ROOT_V10_PEM = `' + pem + '`;'
          if old not in text:
              raise SystemExit('expected filesystem PEM loader not found')
          target.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Validate Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/thorfiscal-cancel/index.ts
      - name: Commit fix and cleanup workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add supabase/functions/thorfiscal-cancel/index.ts
          git rm .github/workflows/one-off-fix-thorfiscal-cancel-boot.yml
          git commit -m 'fix: bundle ICP-Brasil root in NFC-e cancellation [skip-cancel-boot-fix]'
          git push
