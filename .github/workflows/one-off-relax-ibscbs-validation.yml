name: One-off Relax IBS CBS Validation

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip-relax-ibscbs]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Relax IBS/CBS hard requirement per 31/07/2026 technical act
        shell: python
        run: |
          from pathlib import Path
          path = Path('supabase/functions/thorfiscal-authorize/index.ts')
          text = path.read_text(encoding='utf-8')
          old = '''  let ibsCbs: Json | undefined;\n  const rtcRequired = regime === 3 && Date.now() >= Date.parse("2026-08-03T00:00:00-03:00");\n\n  if (!Object.keys(ibsSource).length) {\n    if (rtcRequired) errors.push(`item_${index}_ibscbs_required`);\n  } else {'''
          new = '''  let ibsCbs: Json | undefined;\n  // Ato Tecnico Conjunto CGIBS/RFB nº 1, de 31/07/2026: as regras de\n  // validacao que rejeitavam DF-e pela simples ausencia de IBS/CBS foram\n  // suspensas. Mantemos apenas uma chave operacional para futura reativacao\n  // sem novo deploy quando houver novo ato/cronograma oficial.\n  const rtcRequired = /^(1|true|yes)$/i.test(str(Deno.env.get("FORCE_IBSCBS_REQUIRED")));\n\n  if (!Object.keys(ibsSource).length) {\n    if (rtcRequired) errors.push(`item_${index}_ibscbs_required`);\n  } else {'''
          if old not in text:
            raise SystemExit('Expected hard-coded IBS/CBS requirement block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check ThorFiscal
        run: deno check --node-modules-dir=auto supabase/functions/thorfiscal-authorize/index.ts

      - name: Validate relaxed rule contract
        shell: python
        run: |
          from pathlib import Path
          text = Path('supabase/functions/thorfiscal-authorize/index.ts').read_text(encoding='utf-8')
          assert 'Date.parse("2026-08-03T00:00:00-03:00")' not in text
          assert 'FORCE_IBSCBS_REQUIRED' in text
          assert 'item_${index}_ibscbs_incomplete' in text
          assert 'item_${index}_ibscbs_classification_mismatch' in text

      - name: Remove one-off workflow and commit
        run: |
          rm .github/workflows/one-off-relax-ibscbs-validation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions/thorfiscal-authorize/index.ts .github/workflows/one-off-relax-ibscbs-validation.yml
          git commit -m "fix: allow NFC-e without IBS CBS under current transition rule [skip-relax-ibscbs]"
          git push origin HEAD:main
