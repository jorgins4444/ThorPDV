name: Validate branch profile routing
on:
  push:
    branches: [feat/branch-license-thorcontrol]
    paths:
      - '.github/scripts/patch-branch-profile-routing.py'
      - '.github/workflows/oneoff-branch-profile-routing.yml'
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/branch-license-thorcontrol
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python .github/scripts/patch-branch-profile-routing.py
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
      - run: npm run lint
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'src/app/dashboard/[...slug]/branches-workspace.tsx' 'src/app/dashboard/[...slug]/branch-config-workspace.tsx'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "feat: load complete branch profiles and route selected unit"
          git push origin HEAD:feat/branch-license-thorcontrol
