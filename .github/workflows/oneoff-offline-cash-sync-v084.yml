name: Validate offline daily cash sync v084

on:
  push:
    branches: [fix/offline-daily-cash-sync-v084]
    paths:
      - 'desktop-pdv/agent/sync.js'
      - 'desktop-pdv/package.json'
      - '.github/workflows/oneoff-offline-cash-sync-v084.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/offline-daily-cash-sync-v084
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: JavaScript syntax
        run: node --check desktop-pdv/agent/sync.js
      - name: Version
        run: node -e "const p=require('./desktop-pdv/package.json'); if(p.version!=='0.8.4') process.exit(1); console.log(p.version)"
      - name: Test business-date conversion and offline ordering
        run: |
          node <<'NODE'
          const {SyncEngine,syncBusinessDate,syncEventBusinessDate}=require('./desktop-pdv/agent/sync');
          if(syncEventBusinessDate({payload:{business_date:'2026-08-10'}})!=='2026-08-10') throw new Error('explicit business date failed');
          if(syncBusinessDate('2026-08-11T02:30:00Z')!=='2026-08-10') throw new Error('Fortaleza timezone failed');

          const queue=[
            {id:'old-open',type:'cash_open',payload:{business_date:'2026-08-10',occurred_at:'2026-08-10T12:00:00-03:00'},attempts:0},
            {id:'old-sale',type:'sale_completed',payload:{occurred_at:'2026-08-10T22:00:00-03:00'},attempts:0},
            {id:'today-open',type:'cash_open',payload:{business_date:'2026-08-11',occurred_at:'2026-08-11T08:00:00-03:00'},attempts:0},
            {id:'today-sale',type:'sale_completed',payload:{occurred_at:'2026-08-11T09:00:00-03:00'},attempts:0},
          ];
          const sequence=[];
          const store={
            pending:(limit=100)=>queue.slice(0,limit),
            markProcessed:(id)=>{const i=queue.findIndex(x=>x.id===id);if(i>=0)queue.splice(i,1)},
            markRejected:(id,error)=>{throw new Error(`unexpected reject ${id}: ${error}`)},
            markRetry:()=>{}, set:()=>{}, get:()=>'', queueStats:()=>({pending:queue.length,rejected:0,synced:0}),
            applyPull:()=>{},
          };
          const engine=new SyncEngine({store,apiBase:'https://example.invalid',tokenProvider:()=> 'token',onState:()=>{},appVersion:'0.8.4'});
          engine.request=async(path,body)=>{
            if(path==='/api/pdv/push'){
              const ids=body.events.map(e=>e.id); sequence.push(`push:${ids.join(',')}`);
              return {ok:true,results:ids.map(id=>({id,status:'processed',result:{}}))};
            }
            if(path==='/api/pdv/cash/rollover'){sequence.push('rollover');return {ok:true};}
            if(path==='/api/pdv/pull'){sequence.push('pull');return {ok:true};}
            if(path==='/api/pdv/heartbeat'){sequence.push('heartbeat');return {ok:true};}
            throw new Error(`unexpected path ${path}`);
          };
          (async()=>{
            // Freeze Date used by the engine's today calculation.
            const RealDate=Date;
            global.Date=class extends RealDate{constructor(...args){super(...(args.length?args:['2026-08-11T15:00:00Z']))}static now(){return new RealDate('2026-08-11T15:00:00Z').getTime()}};
            const result=await engine.run(true);
            global.Date=RealDate;
            if(!result.ok) throw new Error(result.error||'run failed');
            const expected=['push:old-open,old-sale','rollover','push:today-open,today-sale','rollover','pull','heartbeat'];
            if(JSON.stringify(sequence)!==JSON.stringify(expected)) throw new Error(`bad sequence ${JSON.stringify(sequence)}`);
            if(queue.length) throw new Error(`queue not drained: ${queue.map(x=>x.id).join(',')}`);
            console.log('offline rollover ordering OK',sequence.join(' -> '));
          })().catch(err=>{console.error(err);process.exit(1)});
          NODE
      - name: Install web dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint
