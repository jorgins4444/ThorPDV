name: Cancel animation v078

on:
  push:
    branches:
      - feat/cancel-animation-v078

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feat/cancel-animation-v078
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply patch
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/apply_cancel_animation_v078.py')
          s=p.read_text()
          s=s.replace('pattern.subn(replacement, s, count=1)','pattern.subn(lambda _m: replacement, s, count=1)')
          s=s.replace('cancel_pattern.subn(cancel_replacement, s, count=1)','cancel_pattern.subn(lambda _m: cancel_replacement, s, count=1)')
          p.write_text(s)
          PY
          python scripts/apply_cancel_animation_v078.py
      - name: Validate Desktop
        run: |
          node --check desktop-pdv/renderer/app.js
          node --check desktop-pdv/main.js
          node --check desktop-pdv/agent/index.js
          node -e "const p=require('./desktop-pdv/package.json');if(p.version!=='0.7.8')process.exit(1)"
      - name: Validate Thor Gestão
        run: |
          npm install
          npm run typecheck
          npm run build
          npm run lint
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-off-cancel-animation-v078.yml scripts/apply_cancel_animation_v078.py
          git add desktop-pdv/renderer/app.js desktop-pdv/renderer/styles.css desktop-pdv/package.json src/app/dashboard/'[...slug]'/fiscal-workspace.tsx src/app/dashboard/'[...slug]'/fiscal.css
          git commit -m "feat: animate NFC-e cancellation flow"
          git push origin HEAD:feat/cancel-animation-v078
