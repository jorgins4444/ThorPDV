name: One-off secure update resume v082

on:
  push:
    branches: [feature/update-experience-v082]
    paths:
      - '.github/scripts/patch-update-resume-security-v082.py'
      - '.github/workflows/oneoff-update-resume-security-v082.yml'

permissions:
  contents: write

jobs:
  secure-resume:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/update-experience-v082
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply secure resume patch
        run: python .github/scripts/patch-update-resume-security-v082.py
      - name: Validate JavaScript
        run: |
          node --check desktop-pdv/main.js
          node --check desktop-pdv/updater.js
          node --check desktop-pdv/renderer/app.js
          node --check desktop-pdv/renderer/update-center.js
      - name: Validate security markers
        run: |
          grep -q "resumeToken" desktop-pdv/updater.js
          grep -q "validatedUpdateResume" desktop-pdv/main.js
          ! grep -q "resumeOperatorId" desktop-pdv/updater.js
      - name: Commit secure resume
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-pdv/main.js desktop-pdv/updater.js
          if git diff --cached --quiet; then
            echo "No secure-resume changes to commit"
          else
            git commit -m "security: encrypt update session resume token"
            git push origin HEAD:feature/update-experience-v082
          fi
