name: One-off NFC-e PI QRCode URL Fix

on:
  push:
    branches:
      - fix/nfce-pi-qrcode-url-20260811
    paths:
      - '.github/workflows/oneoff-nfce-pi-qrcode-url.yml'

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nfce-pi-qrcode-url-20260811
      - name: Apply Piauí QR-Code URL fix
        shell: python
        run: |
          from pathlib import Path
          p=Path('supabase/functions/thorfiscal-authorize/index.ts')
          s=p.read_text()
          old='''  const env = homologation ? "homologacao" : "producao";\n  const qrBase = getNFCeQRCodeUrl(uf, env as any);\n  const consulta = getNFCeConsultaUrl(uf, env as any);'''
          new='''  const env = homologation ? "homologacao" : "producao";\n  // SEFAZ-PI validates the QR-Code base URL literally (RV 395).\n  // The published PI NFC-e endpoints use http:// in Grupo ZX.\n  const isPiaui = String(uf).trim().toUpperCase() === "PI";\n  const qrBase = isPiaui\n    ? "http://www.sefaz.pi.gov.br/nfce/qrcode"\n    : getNFCeQRCodeUrl(uf, env as any);\n  const consulta = isPiaui\n    ? "http://www.sefaz.pi.gov.br/nfce/consulta"\n    : getNFCeConsultaUrl(uf, env as any);'''
          if old not in s:
              raise SystemExit('target block not found')
          p.write_text(s.replace(old,new,1))
      - name: Validate URL contract
        shell: bash
        run: |
          grep -F 'http://www.sefaz.pi.gov.br/nfce/qrcode' supabase/functions/thorfiscal-authorize/index.ts
          grep -F 'http://www.sefaz.pi.gov.br/nfce/consulta' supabase/functions/thorfiscal-authorize/index.ts
          grep -F 'p=${accessKey}|3|${tpAmb}' supabase/functions/thorfiscal-authorize/index.ts
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check ThorFiscal
        run: deno check --node-modules-dir=auto supabase/functions/thorfiscal-authorize/index.ts
      - name: Commit implementation
        run: |
          git config user.name 'ThorPDV Automation'
          git config user.email 'actions@users.noreply.github.com'
          git add supabase/functions/thorfiscal-authorize/index.ts
          git commit -m 'fix: use official Piauí NFC-e QR-Code URL' || exit 0
          git push
