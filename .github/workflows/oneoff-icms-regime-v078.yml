name: One-off ICMS Regime v078

on:
  push:
    paths:
      - '.github/workflows/oneoff-icms-regime-v078.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ICMS tag selection by CRT
        run: python3 scripts/patch_icms_regime_selection_v078.py
      - name: Validate web application
        run: |
          npm install
          npm run typecheck
          npm run build
      - name: Commit fix
        run: |
          git config user.name "ThorPDV Automation"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/functions/thorfiscal-authorize/index.ts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: select ICMS CST or CSOSN according to CRT"
          git push
