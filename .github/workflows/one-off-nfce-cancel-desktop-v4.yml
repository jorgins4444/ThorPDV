name: One-off NFC-e Cancellation Desktop V4

on:
  push:
    branches: [feat/nfce-cancel-30m-20260811]

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[skip-nfce-cancel-desktop-v4]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reuse validated Desktop patch
        shell: python
        run: |
          from pathlib import Path
          src=Path('.github/workflows/one-off-nfce-cancel-desktop-v3.yml').read_text(encoding='utf-8').splitlines()
          name_idx=next(i for i,line in enumerate(src) if '- name: Patch Desktop cancellation flow' in line)
          run_idx=next(i for i in range(name_idx+1,len(src)) if src[i].strip()=='run: |')
          body=[]
          for line in src[run_idx+1:]:
              if line.startswith('      - ') or line.startswith('      - uses:'):
                  break
              body.append(line[10:] if line.startswith('          ') else line)
          script='\n'.join(body)+'\n'
          Path('/tmp/patch_desktop.py').write_text(script,encoding='utf-8')
          compile(script,'patch_desktop.py','exec')
          exec(compile(script,'patch_desktop.py','exec'),{'__name__':'__main__'})

      - name: Validate Desktop JavaScript
        run: |
          node --check desktop-pdv/agent/v3.js
          node --check desktop-pdv/renderer/app.js
          node --check desktop-pdv/main.js

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Validate cancellation Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/thorfiscal-cancel/index.ts

      - name: Validate cancellation contract
        shell: python
        run: |
          from pathlib import Path
          a=Path('desktop-pdv/agent/v3.js').read_text(encoding='utf-8')
          r=Path('desktop-pdv/renderer/app.js').read_text(encoding='utf-8')
          e=Path('supabase/functions/thorfiscal-cancel/index.ts').read_text(encoding='utf-8')
          m=Path('supabase/migrations/20260811145500_nfce_cancellation_30m.sql').read_text(encoding='utf-8')
          assert '/api/pdv/fiscal/cancel' in a
          assert '30 * 60 * 1000' in a
          assert 'nfce_cancellation_window_expired' in a
          assert 'Cancelar venda + NFC-e' in r
          assert 'NFCE_CANCEL_WINDOW_MS=30*60*1000' in r
          assert 'CancelaNFeUseCase' in e
          assert 'status: "cancelled"' in e
          assert "interval '30 minutes'" in m
          assert 'thorfiscal_claim_cancellation' in m

      - name: Commit Desktop implementation and cleanup workflows
        run: |
          rm -f .github/workflows/one-off-nfce-cancel-desktop-v3.yml .github/workflows/one-off-nfce-cancel-desktop-v4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop-pdv/agent/v3.js desktop-pdv/renderer/app.js .github/workflows/one-off-nfce-cancel-desktop-v3.yml .github/workflows/one-off-nfce-cancel-desktop-v4.yml
          git commit -m "feat: cancel NFC-e before sale within 30-minute window [skip-nfce-cancel-desktop-v4]"
          git push origin HEAD:feat/nfce-cancel-30m-20260811
